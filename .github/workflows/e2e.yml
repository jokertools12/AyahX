name: AyahX E2E
on:
  pull_request:
    paths: ['src/**', 'public/**', 'server/**', 'scripts/**', 'index.html', 'package*.json', 'vite.config.ts', 'tooling/e2e/**', '.github/workflows/e2e.yml', 'docs/data/d3-*', 'docs/progress.md', 'docs/plan/DECISIONS.md', 'docs/railway-ops-log.md', 'FEATURE_QA_LOG.md']
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'server/**', 'scripts/**', 'index.html', 'package*.json', 'vite.config.ts', 'tooling/e2e/**', '.github/workflows/e2e.yml', 'docs/data/d3-*', 'docs/progress.md', 'docs/plan/DECISIONS.md', 'docs/railway-ops-log.md', 'FEATURE_QA_LOG.md']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ayahx-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tooling/e2e/package-lock.json
      - run: npm ci
      - run: npm --prefix tooling/e2e ci
      - name: Install pinned Chromium and Linux libraries
        run: node tooling/e2e/node_modules/@e2e-dev/web/dist/bin.js install chromium --with-deps
      - name: Test desktop and mobile UI
        run: npm run test:e2e
      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ayahx-e2e
          include-hidden-files: true
          path: |
            tooling/e2e/.e2e/report.json
            tooling/e2e/.e2e/junit.xml
            tooling/e2e/.e2e/summary.md
            tooling/e2e/.e2e/artifacts
            tooling/e2e/.e2e/failures
          if-no-files-found: warn
          retention-days: 7
