name: Enterprise foundation
on:
  pull_request:
    paths: ['server/**', 'shared/**', 'src/**', 'database/migrations/**', 'scripts/enterprise-*.ts', 'package*.json', 'tsconfig*.json', '.github/workflows/enterprise-foundation.yml']
  push:
    branches: [main, staging]
    paths: ['server/**', 'shared/**', 'src/**', 'database/migrations/**', 'scripts/enterprise-*.ts', 'package*.json', 'tsconfig*.json', '.github/workflows/enterprise-foundation.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: enterprise-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - name: Lint foundation
        run: npx eslint shared/recordingAvailability.ts server/services/recordingAvailabilityService.ts server/services/quranSourceRegistry.ts server/routes/quran.ts src/test/recordingAvailability.test.ts src/test/quranSourceRegistry.test.ts src/test/quranSourceCatalogApi.test.ts
      - name: Typecheck application and tests
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Typecheck tooling entrypoint
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Check isolated catalog migration
        run: |
          npx eslint server/utils/canonicalIntegrity.ts server/db/migrations/enterpriseCatalog.ts scripts/enterprise-catalog-migration.ts src/test/enterpriseCatalogMigration.test.ts
          npx tsc --noEmit --strict --skipLibCheck --module ESNext --moduleResolution bundler --target ES2022 --esModuleInterop server/db/migrations/enterpriseCatalog.ts scripts/enterprise-catalog-migration.ts
          npm test -- --run src/test/enterpriseCatalogMigration.test.ts
      - name: Check trusted recording repository
        run: |
          npx eslint server/services/catalogApprovalPolicy.ts server/services/recordingAvailabilityRepository.ts src/test/recordingAvailabilityRepository.test.ts
          npx tsc --noEmit --strict --skipLibCheck --module ESNext --moduleResolution bundler --target ES2022 --esModuleInterop server/services/catalogApprovalPolicy.ts server/services/recordingAvailabilityRepository.ts
          npm test -- --run src/test/recordingAvailabilityRepository.test.ts
      - name: Check catalog capability policy
        run: |
          npx eslint server/services/catalogAccessPolicy.ts src/test/catalogAccessPolicy.test.ts
          npx tsc --noEmit --strict --skipLibCheck --module ESNext --moduleResolution bundler --target ES2022 --esModuleInterop server/services/catalogAccessPolicy.ts
          npm test -- --run src/test/catalogAccessPolicy.test.ts
      - name: Check authority schema runner
        run: |
          npx eslint server/db/migrations/additiveMigrationRunner.ts server/db/migrations/enterpriseAuthority.ts scripts/enterprise-authority-migration.ts src/test/enterpriseAuthorityMigration.test.ts
          npx tsc --noEmit --strict --skipLibCheck --module ESNext --moduleResolution bundler --target ES2022 --esModuleInterop server/db/migrations/enterpriseAuthority.ts scripts/enterprise-authority-migration.ts
          npm test -- --run src/test/enterpriseAuthorityMigration.test.ts
      - name: Verify contract and HTTP authorization
        run: npm test -- --run src/test/recordingAvailability.test.ts src/test/quranSourceRegistry.test.ts src/test/quranSourceCatalogApi.test.ts src/test/alignmentReviewAuthorization.test.ts src/test/alignmentReviewPanel.test.tsx src/test/alignmentProvider.test.ts src/test/alignmentAttestation.test.ts src/test/httpMiddlewareSecurity.test.ts
      - name: Check audited catalog role management
        run: |
          npx eslint server/db/databaseIdentity.ts server/services/catalogGrantRepository.ts server/services/catalogGrantService.ts server/services/catalogGrantRuntime.ts server/routes/catalog.ts scripts/enterprise-owner-bootstrap.ts src/test/catalogGrantRepository.test.ts src/test/catalogGrantService.test.ts src/test/catalogGrantApi.test.ts src/test/catalogAccountDeletion.test.ts src/test/enterpriseOwnerBootstrapCli.test.ts
          npx tsc --noEmit --strict --skipLibCheck --module ESNext --moduleResolution bundler --target ES2022 --esModuleInterop server/db/databaseIdentity.ts server/services/catalogGrantRepository.ts server/services/catalogGrantService.ts server/services/catalogGrantRuntime.ts server/routes/catalog.ts scripts/enterprise-owner-bootstrap.ts
          npm test -- --run src/test/catalogGrantRepository.test.ts src/test/catalogGrantService.test.ts src/test/catalogGrantApi.test.ts src/test/catalogAccountDeletion.test.ts src/test/enterpriseOwnerBootstrapCli.test.ts
      - name: Build browser and server
        run: npm run build
