<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Offline Deterministic Render Harness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;800&family=El+Messiri:wght@400;700&family=Katibeh&family=Lalezar&family=Lateef:wght@400;700&family=Mada:wght@400;700&family=Marhey:wght@400;700&family=Mirza:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Rakkas&family=Reem+Kufi:wght@400;700&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #040D12;
      overflow: hidden;
    }
    #render-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="render-canvas"></canvas>

  <script>
    (function() {
      // The scene controller is a factory so the visible preview canvas and
      // the full-resolution local recorder can execute the same scene source.
      // The native workers still use the default controller below through the
      // original singleton API.
      function createRenderController(targetCanvas) {
      const canvas = targetCanvas;
      if (!canvas) throw new Error('Render harness canvas is missing.');
      const ctx = canvas.getContext('2d', { alpha: false });

      let currentManifest = null;
      let bgImage = null;
      let bgFramesPattern = null;
      let lastValidVideoFrame = null;
      let bgVideo = null;
      let videoBackgroundStatus = 'not-requested';
      let lastDirectVideoRequestSeconds = null;
      let slideshowImages = [];
      let logoWatermarkImage = null;
      let isReady = false;

      // Font family mapping for canvas
      const FONT_MAP = {
        '"Noto Naskh Arabic", serif': 'Noto Naskh Arabic',
        '"Amiri", serif': 'Amiri',
        '"Amiri Quran", serif': 'Amiri Quran',
        '"Cairo", sans-serif': 'Cairo',
        '"Scheherazade New", serif': 'Scheherazade New',
        '"Aref Ruqaa", serif': 'Aref Ruqaa',
        '"Reem Kufi", sans-serif': 'Reem Kufi',
        '"Lateef", serif': 'Lateef',
        '"El Messiri", sans-serif': 'El Messiri',
        '"Tajawal", sans-serif': 'Tajawal',
        '"Mada", sans-serif': 'Mada',
        '"Katibeh", serif': 'Katibeh',
        '"Rakkas", serif': 'Rakkas',
        '"Lalezar", cursive': 'Lalezar',
        '"Mirza", serif': 'Mirza',
        '"Marhey", cursive': 'Marhey',
      };

      function resolveFontFamily(fam) {
        if (!fam) return 'Noto Naskh Arabic';
        return FONT_MAP[fam] || fam.replace(/"/g, '') || 'Noto Naskh Arabic';
      }

      // Convert Arabic digits
      function toArabicDigits(num) {
        const arabicNums = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        return num.toString().split('').map(d => arabicNums[parseInt(d)] || d).join('');
      }

      // Strips Arabic diacritics / tashkeel for phonetic analysis
      function stripTashkeel(str) {
        return (str || '').replace(/[\u064B-\u0652\u0670\u06D6-\u06ED]/g, '');
      }

      // Deterministic Animate profiles. These functions intentionally mirror
      // src/lib/animationTimeline.ts; both consume trusted timing events and
      // never synthesize a word boundary from duration or WPM.
      const ANIMATION_PROFILES = ['static', 'karaoke', 'teleprompter', 'reveal', 'fade', 'spotlight', 'isolate', 'consume'];
      function normalizeAnimationProfile(value) {
        return ANIMATION_PROFILES.indexOf(value) >= 0 ? value : 'karaoke';
      }
      function getAnimationState(index, activeIndex, progress, profileInput, wordCount, reducedMotion) {
        const profile = normalizeAnimationProfile(profileInput);
        const safeActive = Number.isFinite(activeIndex) && activeIndex >= 0 && activeIndex < wordCount ? activeIndex : null;
        const distance = safeActive === null ? Infinity : Math.abs(index - safeActive);
        const isActive = safeActive === index;
        let opacity = 1;
        let emphasis = isActive ? 1 : 0;
        let scale = 1;
        let translateY = 0;
        if (profile === 'teleprompter') {
          opacity = distance <= 2 ? Math.max(0.28, 1 - distance * 0.28) : 0.12;
          translateY = safeActive === null ? 0 : (index - safeActive) * 2.5;
          emphasis = isActive ? 1 : Math.max(0, 1 - distance * 0.4);
        } else if (profile === 'reveal') {
          opacity = safeActive === null || index <= safeActive ? 1 : 0.22;
          emphasis = isActive ? 1 : 0;
        } else if (profile === 'fade') {
          opacity = safeActive === null ? 1 : (isActive ? 1 : index < safeActive ? 0.58 : 0.22);
          emphasis = isActive ? 1 : index < (safeActive === null ? -1 : safeActive) ? 0.25 : 0;
        } else if (profile === 'spotlight') {
          opacity = safeActive === null ? 0.82 : (isActive ? 1 : 0.24);
          emphasis = isActive ? 1 : 0;
        } else if (profile === 'isolate') {
          opacity = safeActive === null ? 0.18 : (isActive ? 1 : 0);
          emphasis = isActive ? 1 : 0;
        } else if (profile === 'consume') {
          opacity = safeActive === null || index >= safeActive ? (isActive ? 1 : 0.34) : 0;
          emphasis = isActive ? 1 : 0;
        } else if (profile === 'static') {
          opacity = 1;
          emphasis = isActive ? 0.35 : 0;
        }
        if (isActive && profile !== 'static' && !reducedMotion) {
          const pulse = Math.sin(Math.PI * Math.min(Math.max(progress || 0, 0), 1));
          scale = 1 + pulse * 0.025;
          if (profile === 'teleprompter') translateY -= pulse * 1.5;
        }
        return { opacity: Math.min(1, Math.max(0, opacity)), emphasis, scale, translateY, isActive };
      }
      function resolveVerseWordWindow(mode, totalWords, activeWordIndex) {
        const safeTotal = Number.isFinite(totalWords) ? Math.max(0, Math.floor(totalWords)) : 0;
        if (mode === 'full') return { startIndex: 0, wordCount: safeTotal };
        const safeActive = Number.isInteger(activeWordIndex) ? activeWordIndex : null;
        if (safeTotal === 0 || safeActive === null || safeActive < 0 || safeActive >= safeTotal) {
          return { startIndex: 0, wordCount: 0 };
        }
        if (mode === 'wordByWord' || mode === 'letterByLetter') return { startIndex: safeActive, wordCount: 1 };
        if (mode === 'twoWords') {
          const startIndex = Math.floor(safeActive / 2) * 2;
          return { startIndex, wordCount: Math.min(2, safeTotal - startIndex) };
        }
        const pattern = [3, 2];
        let startIndex = 0;
        let patternIndex = 0;
        while (startIndex < safeTotal) {
          const wordCount = Math.min(pattern[patternIndex % pattern.length], safeTotal - startIndex);
          if (safeActive < startIndex + wordCount) return { startIndex, wordCount };
          startIndex += wordCount;
          patternIndex += 1;
        }
        return { startIndex: 0, wordCount: 0 };
      }

      // Rosette / Ayah Badge Drawing with full shape support
      function drawAyahBadge(ctx, x, y, ayahNum, size, shape, colorScheme) {
        ctx.save();
        ctx.translate(x, y);

        const colors = {
          gold: { primary: '#D4AF37', secondary: '#F5E050', text: '#FFFFFF', border: '#AA820A' },
          emerald: { primary: '#10B981', secondary: '#34D399', text: '#FFFFFF', border: '#059669' },
          silver: { primary: '#9CA3AF', secondary: '#D1D5DB', text: '#FFFFFF', border: '#6B7280' },
          white: { primary: '#FFFFFF', secondary: '#F3F4F6', text: '#000000', border: '#E5E7EB' },
          royal: { primary: '#3B82F6', secondary: '#60A5FA', text: '#FFFFFF', border: '#1D4ED8' }
        }[colorScheme || 'gold'] || { primary: '#D4AF37', secondary: '#F5E050', text: '#FFFFFF', border: '#AA820A' };

        // 3D Gilded Quranic Bracket / Medallion Style ﴿...﴾
        if (shape === 'quran3d') {
          const metalGrad = ctx.createLinearGradient(-size, -size, size, size);
          metalGrad.addColorStop(0, '#FFE082');
          metalGrad.addColorStop(0.3, '#D4AF37');
          metalGrad.addColorStop(0.6, '#FFF8E1');
          metalGrad.addColorStop(0.85, '#B78727');
          metalGrad.addColorStop(1, '#8C6B1B');

          ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
          ctx.shadowBlur = size * 0.4;
          ctx.beginPath();
          ctx.arc(0, 0, size * 1.05, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(15, 12, 5, 0.8)';
          ctx.fill();

          ctx.strokeStyle = metalGrad;
          ctx.lineWidth = size * 0.1;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 0, size * 0.85, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 235, 150, 0.65)';
          ctx.lineWidth = size * 0.04;
          ctx.stroke();

          const arabic = toArabicDigits(ayahNum);
          ctx.font = `bold ${Math.round(size * 1.15)}px "Noto Naskh Arabic", "Amiri", serif`;
          ctx.fillStyle = '#FFFFFF';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
          ctx.shadowBlur = 4;
          ctx.fillText(arabic, 0, 1);
          ctx.restore();
          return;
        }

        // Outer glow
        ctx.shadowColor = colors.primary;
        ctx.shadowBlur = size * 0.45;
        ctx.fillStyle = colors.primary;
        ctx.strokeStyle = colors.border;
        ctx.lineWidth = size * 0.08;

        ctx.beginPath();
        if (shape === 'star') {
          for (let i = 0; i < 16; i++) {
            const angle = (i * Math.PI) / 8 - Math.PI / 2;
            const r = i % 2 === 0 ? size : size * 0.6;
            const px = Math.cos(angle) * r;
            const py = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
        } else if (shape === 'diamond') {
          ctx.moveTo(0, -size);
          ctx.lineTo(size * 1.1, 0);
          ctx.lineTo(0, size);
          ctx.lineTo(-size * 1.1, 0);
          ctx.closePath();
        } else if (shape === 'octagon') {
          for (let i = 0; i < 8; i++) {
            const angle = (i * Math.PI) / 4 - Math.PI / 8;
            const px = Math.cos(angle) * size;
            const py = Math.sin(angle) * size;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
        } else if (shape === 'hexagon') {
          for (let i = 0; i < 6; i++) {
            const angle = (i * Math.PI) / 3 - Math.PI / 6;
            const px = Math.cos(angle) * size;
            const py = Math.sin(angle) * size;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
        } else if (shape === 'flower') {
          const petals = 8;
          for (let i = 0; i < petals; i++) {
            const angle = (i * 2 * Math.PI) / petals;
            const nextAngle = ((i + 1) * 2 * Math.PI) / petals;
            const midAngle = (angle + nextAngle) / 2;
            const x1 = size * Math.cos(angle);
            const y1 = size * Math.sin(angle);
            const cpX = size * 1.28 * Math.cos(midAngle);
            const cpY = size * 1.28 * Math.sin(midAngle);
            const x2 = size * Math.cos(nextAngle);
            const y2 = size * Math.sin(nextAngle);
            if (i === 0) ctx.moveTo(x1, y1);
            ctx.quadraticCurveTo(cpX, cpY, x2, y2);
          }
          ctx.closePath();
        } else if (shape === 'square') {
          if (ctx.roundRect) ctx.roundRect(-size * 0.9, -size * 0.9, size * 1.8, size * 1.8, size * 0.25);
          else ctx.rect(-size * 0.9, -size * 0.9, size * 1.8, size * 1.8);
        } else {
          // Circle / Rosette default
          ctx.arc(0, 0, size, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.stroke();

        // Inner circle
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.72, 0, Math.PI * 2);
        ctx.fill();

        // Arabic Ayah Number Text
        ctx.fillStyle = colors.text;
        ctx.font = `bold ${Math.round(size * 0.85)}px "Amiri", "Cairo", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(toArabicDigits(ayahNum), 0, size * 0.08);

        ctx.restore();
      }

      // Safe roundRect helper
      function safeRoundRect(ctx, x, y, w, h, r) {
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, r);
        } else {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          ctx.closePath();
        }
      }

      function getResponsiveHeaderLayout({ W, H, S, showSurahName, showReciterName, position, nameStyle, reciterStyle, fontSize }) {
        const isBottom = position === 'bottom';
        const titleShapeHalf = { banner:45, calligraphy:42, circle:75, diamond:80, ribbon:35, modern:38, ornate:41, minimal:34, classic:50 }[nameStyle || 'classic'] || 50;
        const titleHalf = Math.max(titleShapeHalf * S, fontSize * 2.5 * S * 0.65 + 8 * S);
        const reciterShapeHalf = ['badge', 'pill'].includes(reciterStyle || '') ? 22 : reciterStyle === 'tag' ? 19 : 17;
        const reciterHalf = Math.max(reciterShapeHalf * S, fontSize * S * 0.65 + 3 * S);
        const gap = Math.max(14 * S, H * 0.018);
        const edge = Math.max(24 * S, H * 0.045);
        const titleX = position === 'topLeft' ? Math.min(260 * S, W * 0.28) : position === 'topRight' ? Math.max(W - 260 * S, W * 0.72) : W / 2;
        const titleY = isBottom ? H - edge - titleHalf : position === 'center' ? H * 0.25 : edge + titleHalf;
        let reciterX = titleX;
        let reciterY = titleY;
        if (showReciterName) {
          if (!showSurahName) {
            reciterX = (position === 'topLeft' || position === 'topRight') ? titleX : W / 2;
            reciterY = isBottom ? H - edge - reciterHalf : edge + reciterHalf;
          } else {
            reciterY = isBottom ? titleY - titleHalf - gap - reciterHalf : titleY + titleHalf + gap + reciterHalf;
          }
        }
        const edgeY = showReciterName ? (isBottom ? reciterY - reciterHalf : reciterY + reciterHalf) : (isBottom ? titleY - titleHalf : titleY + titleHalf);
        return { titleX, titleY, reciterX, reciterY, separatorY: isBottom ? edgeY - gap * 0.65 : edgeY + gap * 0.65 };
      }

      function getResponsiveBrandingLayout({ W, H, S, logoPosition, logoSize, socialPosition, socialSize, headerActive, headerPosition, headerSeparatorY, frameActive }) {
        const edge = Math.max(28 * S, W * 0.025) + (frameActive ? 18 * S : 0);
        const gap = Math.max(18 * S, H * 0.022);
        const radius = logoSize * S / 2;
        const socialHeight = Math.max(30 * S, socialSize * S + 14 * S);
        let logoX = W - edge - radius;
        let logoY = edge + radius;
        if (logoPosition === 'topLeft') logoX = edge + radius;
        if (logoPosition === 'bottomRight') { logoX = W - edge - radius; logoY = H - edge - radius; }
        if (logoPosition === 'bottomLeft') { logoX = edge + radius; logoY = H - edge - radius; }
        const collidesWithTopCorner = headerActive && ((logoPosition === 'topRight' && headerPosition === 'topRight') || (logoPosition === 'topLeft' && headerPosition === 'topLeft'));
        if (collidesWithTopCorner) logoX = logoPosition === 'topRight' ? edge + radius : W - edge - radius;

        let socialX = W / 2;
        let socialY = H - edge;
        if (socialPosition === 'bottomLeft') socialX = edge;
        if (socialPosition === 'bottomRight') socialX = W - edge;
        if (socialPosition === 'topCenter') {
          socialY = edge + socialHeight;
          if (headerActive) socialY = Math.max(socialY, headerSeparatorY + gap + socialHeight);
        }
        if ((socialPosition === 'bottomRight' && logoPosition === 'bottomRight') || (socialPosition === 'bottomLeft' && logoPosition === 'bottomLeft')) {
          socialY = Math.min(socialY, logoY - radius - gap);
        }
        return { logoX, logoY, logoRadius: radius, socialX, socialY, socialHeight, edge };
      }

      // Islamic Corner Ornaments
      function drawCornerOrnament(ctx, x, y, size, rotation, S) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((rotation * Math.PI) / 180);
        ctx.fillStyle = 'rgba(212, 175, 55, 0.4)';
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(212, 175, 55, 0.6)';
        ctx.lineWidth = 2 * S;
        ctx.beginPath();
        ctx.moveTo(size * 0.2, size * 0.2);
        ctx.quadraticCurveTo(size * 0.5, 0, size * 0.2, -size * 0.2);
        ctx.stroke();
        ctx.restore();
      }

      function drawSideDecoration(ctx, x, y, size, S) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = 'rgba(212, 175, 55, 0.5)';
        ctx.beginPath();
        ctx.ellipse(0, 0, size, size * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(212, 175, 55, 0.7)';
        ctx.lineWidth = 1 * S;
        ctx.stroke();
        ctx.restore();
      }

      function drawGoldenCorner(ctx, x, y, size, flipX = false, flipY = false, S = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
        ctx.strokeStyle = 'rgba(212, 175, 55, 0.75)';
        ctx.lineWidth = 2 * S;
        const r = Math.min(size * 0.45, 26 * S);
        ctx.beginPath();
        ctx.moveTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(4 * S, r * 0.8);
        ctx.quadraticCurveTo(4 * S, 4 * S, r * 0.8, 4 * S);
        ctx.strokeStyle = 'rgba(255, 224, 130, 0.5)';
        ctx.lineWidth = 1 * S;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(r * 0.35, r * 0.35, Math.max(2 * S, r * 0.12), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(212, 175, 55, 0.6)';
        ctx.fill();
        ctx.restore();
      }

      function drawGeometricCorner(ctx, x, y, size, S = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = 'rgba(212, 175, 55, 0.5)';
        ctx.lineWidth = 1 * S;
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(size / 2, 0);
          ctx.lineTo(size, size / 2);
          ctx.lineTo(size / 2, size);
          ctx.lineTo(0, size / 2);
          ctx.closePath();
          ctx.stroke();
          ctx.translate(size / 2, size / 2);
          ctx.rotate(Math.PI / 4);
          ctx.translate(-size / 2, -size / 2);
        }
        ctx.restore();
      }

      // Decorative Frame Drawing (around screen or text box)
      function getResponsiveTextFrameLayout({
        canvasWidth,
        canvasHeight,
        contentTop,
        contentBottom,
        contentWidth,
        scale,
        minWidthRatio = 0.56,
        maxWidthRatio = 0.88,
        safeTopRatio = 0.14,
        safeBottomRatio = 0.92,
      }) {
        const padding = Math.max(20 * scale, Math.min(65 * scale, canvasWidth * 0.045));
        const frameWidth = Math.min(
          canvasWidth * maxWidthRatio,
          Math.max(contentWidth + padding * 2, canvasWidth * minWidthRatio),
        );
        const frameX = (canvasWidth - frameWidth) / 2;
        const safeTop = Math.max(12 * scale, canvasHeight * safeTopRatio);
        const safeBottom = Math.min(canvasHeight - 12 * scale, canvasHeight * safeBottomRatio);
        const rawTop = contentTop - padding;
        const rawBottom = contentBottom + padding;
        let offsetY = 0;
        if (rawTop < safeTop) offsetY += safeTop - rawTop;
        if (rawBottom + offsetY > safeBottom) offsetY += safeBottom - (rawBottom + offsetY);
        const frameY = rawTop + offsetY;
        const frameHeight = Math.max(1, rawBottom + offsetY - frameY);
        return { frameX, frameY, frameWidth, frameHeight, offsetY, padding };
      }

      function drawIslamicFrame(ctx, x, y, width, height, style, S = 1) {
        if (!style || style === 'none') return;
        ctx.save();
        const F = Math.max(0.5, Math.min(2.4, width / 1080));
        const cornerSize = Math.min(width, height) * 0.1;
        const goldColor = 'rgba(212, 175, 55, 0.65)';
        const goldLight = 'rgba(212, 175, 55, 0.35)';

        switch (style) {
          case 'simple':
            ctx.strokeStyle = goldColor;
            ctx.lineWidth = 2 * F;
            ctx.strokeRect(x, y, width, height);
            ctx.strokeStyle = goldLight;
            ctx.lineWidth = 1 * F;
            ctx.strokeRect(x + 6 * F, y + 6 * F, width - 12 * F, height - 12 * F);
            break;

          case 'ornate':
            ctx.strokeStyle = goldColor;
            ctx.lineWidth = 3 * F;
            safeRoundRect(ctx, x, y, width, height, 10 * F);
            ctx.stroke();

            drawCornerOrnament(ctx, x, y, cornerSize, 0, F);
            drawCornerOrnament(ctx, x + width, y, cornerSize, 90, F);
            drawCornerOrnament(ctx, x + width, y + height, cornerSize, 180, F);
            drawCornerOrnament(ctx, x, y + height, cornerSize, 270, F);

            drawSideDecoration(ctx, x + width / 2, y, cornerSize * 0.6, F);
            drawSideDecoration(ctx, x + width / 2, y + height, cornerSize * 0.6, F);
            break;

          case 'golden':
            ctx.shadowColor = 'rgba(212, 175, 55, 0.5)';
            ctx.shadowBlur = 15 * F;
            ctx.strokeStyle = goldColor;
            ctx.lineWidth = 4 * F;
            safeRoundRect(ctx, x, y, width, height, 15 * F);
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = goldLight;
            ctx.lineWidth = 2 * F;
            ctx.setLineDash([10 * F, 5 * F]);
            safeRoundRect(ctx, x + 10 * F, y + 10 * F, width - 20 * F, height - 20 * F, 10 * F);
            ctx.stroke();
            ctx.setLineDash([]);

            drawGoldenCorner(ctx, x, y, cornerSize, false, false, F);
            drawGoldenCorner(ctx, x + width, y, cornerSize, true, false, F);
            drawGoldenCorner(ctx, x + width, y + height, cornerSize, true, true, F);
            drawGoldenCorner(ctx, x, y + height, cornerSize, false, true, F);
            break;

          case 'geometric':
            ctx.strokeStyle = goldColor;
            ctx.lineWidth = 2 * F;
            ctx.strokeRect(x, y, width, height);

            drawGeometricCorner(ctx, x, y, cornerSize, F);
            drawGeometricCorner(ctx, x + width - cornerSize, y, cornerSize, F);
            drawGeometricCorner(ctx, x + width - cornerSize, y + height - cornerSize, cornerSize, F);
            drawGeometricCorner(ctx, x, y + height - cornerSize, cornerSize, F);

            ctx.beginPath();
            ctx.moveTo(x + cornerSize, y + cornerSize / 2);
            ctx.lineTo(x + width - cornerSize, y + cornerSize / 2);
            ctx.moveTo(x + cornerSize, y + height - cornerSize / 2);
            ctx.lineTo(x + width - cornerSize, y + height - cornerSize / 2);

            currentWidth = needed;
          } else {

            currentLine = [w];

      // Helper to preload an image returning a promise with safety timeout
      function preloadImage(url) {
        return new Promise((resolve) => {
          if (!url) return resolve(null);

          // If the source does not expose CORS, the caller can still use its
          // thumbnail/fallback without poisoning a recording canvas.
          if (/^https?:\/\//i.test(url)) img.crossOrigin = 'anonymous';
          let settled = false;
          const timer = setTimeout(() => {
            if (!settled) {
              settled = true;
              resolve(null);
            }

          img.onload = () => {
            if (!settled) {
              settled = true;
              clearTimeout(timer);
              resolve(img);
            }
          };
          img.onerror = () => {
            if (!settled) {
              settled = true;
              clearTimeout(timer);
              resolve(null);
            }
          };

          if (img.complete && img.naturalWidth > 0) {

            clearTimeout(timer);
            resolve(img);
          }

      // Browser-only direct video background. Server renderers provide an

      // hybrid preview/recorder and uses the same requested frame clock.
      function preloadVideo(url) {

          if (!url || typeof document.createElement !== 'function') return resolve(null);

          video.muted = true;

            if (settled) return;
            settled = true;
            clearTimeout(timer);
            resolve(value);

              probeCanvas.height = 2;

      function seekVideo(video, timeSeconds) {

            video.removeEventListener('error', onError);
            resolve(value);

          const onError = () => finish(false);

          video.addEventListener('error', onError, { once: true });

      // a per-frame seek can take hundreds of milliseconds. Once requests are
      // monotonic, let the muted video decode continuously and correct only
      // meaningful drift; paused/scrubbed requests still seek exactly.
      async function syncDirectVideo(video, timeSeconds) {
        if (!video || !Number.isFinite(video.duration) || video.duration <= 0) return false;

      // Memory-bounded ring-cache for extracted video frames

      // Cover-fit: draw image filling canvas without distortion or black bars

          if (!backgroundDrawn && bgImage && bgImage.complete && bgImage.naturalWidth > 0) {

            const t = frameTimeSeconds * (motionSpeed / 3);
