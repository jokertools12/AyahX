services:
  api:
    build: .
    command: node node_modules/tsx/dist/cli.mjs server/index.ts
    env_file: .env
    environment:
      RENDER_QUEUE_DRIVER: bullmq
    depends_on: [redis]
    deploy:
      replicas: 2

  worker-ffmpeg:
    build:
      context: .
      dockerfile: Dockerfile.worker-lite
    command: node node_modules/tsx/dist/cli.mjs server/worker.ts
    env_file: .env
    environment:
      RENDER_QUEUE_DRIVER: bullmq
      RENDER_WORKER_ENGINE: ffmpeg_ass
      FFMPEG_RENDER_MAX_CONCURRENCY: auto
    depends_on: [redis]
    deploy:
      replicas: 2

  worker-skia:
    build:
      context: .
      dockerfile: Dockerfile.worker-lite
    command: node node_modules/tsx/dist/cli.mjs server/worker.ts
    env_file: .env
    environment:
      RENDER_QUEUE_DRIVER: bullmq
      RENDER_WORKER_ENGINE: skia_canvas
      SKIA_RENDER_MAX_CONCURRENCY: auto
    depends_on: [redis]
    deploy:
      replicas: 2

  worker-browser:
    build:
      context: .
      dockerfile: Dockerfile.worker-browser
    command: node node_modules/tsx/dist/cli.mjs server/worker.ts
    env_file: .env
    environment:
      RENDER_QUEUE_DRIVER: bullmq
      RENDER_WORKER_ENGINE: browser_cloud
      BROWSER_RENDER_MAX_CONCURRENCY: auto
    depends_on: [redis]
    deploy:
      replicas: 2

  render-control:
    build:
      context: .
      dockerfile: Dockerfile.worker-lite
    command: node node_modules/tsx/dist/cli.mjs server/renderControl.ts
    env_file: .env
    environment:
      RENDER_QUEUE_DRIVER: bullmq
    depends_on: [redis]
    deploy:
      replicas: 1

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]

volumes:
  redis-data:
