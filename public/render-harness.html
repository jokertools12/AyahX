          ctx.fillStyle = topGrad;
          ctx.fillRect(0, 0, W, H * 0.22);

          const botGrad = ctx.createLinearGradient(0, H * 0.78, 0, H);
          botGrad.addColorStop(0, 'transparent');
          botGrad.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
          ctx.fillStyle = botGrad;
          ctx.fillRect(0, H * 0.78, W, H * 0.22);

          // Cinematic visual direction layer shared with the browser preview.
          // It is deterministic so cloud renders remain frame-stable.
          const visualDesign = displaySettings.visualDesign || 'dawn';
          const palette = visualDesign === 'moonlit'
            ? { core: 'rgba(112, 175, 255, 0.16)', mid: 'rgba(74, 125, 205, 0.07)', veil: 'rgba(4, 10, 30, 0.28)', mark: 'rgba(157, 199, 255, 0.34)' }
            : visualDesign === 'editorial'
              ? { core: 'rgba(194, 226, 184, 0.14)', mid: 'rgba(71, 150, 132, 0.07)', veil: 'rgba(4, 18, 19, 0.25)', mark: 'rgba(179, 225, 187, 0.30)' }
              : { core: 'rgba(255, 206, 128, 0.14)', mid: 'rgba(136, 158, 196, 0.06)', veil: 'rgba(6, 14, 28, 0.24)', mark: 'rgba(242, 194, 112, 0.32)' };
          const atmosphere = ctx.createRadialGradient(W * 0.52, H * 0.30, 0, W * 0.52, H * 0.30, H * 0.72);
          atmosphere.addColorStop(0, palette.core);
          atmosphere.addColorStop(0.32, palette.mid);
          atmosphere.addColorStop(1, 'rgba(6, 14, 28, 0)');
          ctx.fillStyle = atmosphere;
          ctx.fillRect(0, 0, W, H);
          const focusVeil = ctx.createLinearGradient(0, H * 0.34, 0, H * 0.80);
          focusVeil.addColorStop(0, 'rgba(5, 13, 28, 0)');
          focusVeil.addColorStop(0.58, 'rgba(5, 13, 28, 0.08)');
          focusVeil.addColorStop(1, palette.veil);
          ctx.fillStyle = focusVeil;
          ctx.fillRect(0, 0, W, H);
          ctx.save();
          ctx.globalAlpha = 0.8;
          ctx.strokeStyle = palette.mark;
          ctx.lineWidth = Math.max(1, 1.5 * S);
          if (visualDesign === 'moonlit') {
            const cx = W * 0.78, cy = H * 0.16, r = Math.max(18 * S, W * 0.035);
            ctx.beginPath(); ctx.arc(cx, cy, r, 0.35 * Math.PI, 1.65 * Math.PI); ctx.stroke();
            ctx.beginPath(); ctx.arc(cx + r * 0.34, cy - r * 0.18, r * 0.92, 0.45 * Math.PI, 1.55 * Math.PI); ctx.stroke();
          } else if (visualDesign === 'editorial') {
            const inset = W * 0.075, top = H * 0.27, bottom = H * 0.75;
            ctx.setLineDash([5 * S, 9 * S]); ctx.strokeRect(inset, top, W - inset * 2, bottom - top); ctx.setLineDash([]);
          } else {
            const cx = W / 2, top = H * 0.055, w = W * 0.34, h = H * 0.19;
            ctx.beginPath(); ctx.moveTo(cx - w, top + h); ctx.lineTo(cx - w, top + h * 0.48);
            ctx.quadraticCurveTo(cx, top - h * 0.2, cx + w, top + h * 0.48); ctx.lineTo(cx + w, top + h); ctx.stroke();
          }
          ctx.restore();

          // 4. Full-Screen Video Perimeter Border (Screen Frame)
          if (displaySettings.screenBorderStyle && displaySettings.screenBorderStyle !== 'none') {
            drawFullScreenBorder(ctx, W, H, displaySettings.screenBorderStyle, displaySettings.screenBorderColor, S);
          }

          // 5. Surah Name Banner / Header
          const pos = displaySettings.surahNamePosition || 'top';
          const headerLayout = getResponsiveHeaderLayout({
            W, H, S,
            showSurahName: Boolean(displaySettings.showSurahName),
            showReciterName: Boolean(displaySettings.showReciterName),
            position: pos,
            nameStyle: displaySettings.surahNameStyle,
            reciterStyle: displaySettings.reciterNameStyle,
            fontSize: Number(displaySettings.fontSize || 28),
          });
          const bannerY = headerLayout.titleY;
          const bannerX = headerLayout.titleX;

          if (displaySettings.showSurahName) {
            ctx.save();
            const nameStyle = displaySettings.surahNameStyle || 'classic';

            if (nameStyle === 'banner') {
              const bw = Math.min(520 * S, W * 0.8), bh = 88 * S;
              const grad = ctx.createLinearGradient(bannerX - bw / 2, bannerY, bannerX + bw / 2, bannerY);
              grad.addColorStop(0, 'rgba(212, 175, 55, 0)');
              grad.addColorStop(0.2, 'rgba(212, 175, 55, 0.28)');
              grad.addColorStop(0.5, 'rgba(212, 175, 55, 0.42)');
              grad.addColorStop(0.8, 'rgba(212, 175, 55, 0.28)');
              grad.addColorStop(1, 'rgba(212, 175, 55, 0)');
              ctx.fillStyle = grad;
              ctx.fillRect(bannerX - bw / 2, bannerY - bh / 2, bw, bh);
              ctx.strokeStyle = 'rgba(212, 175, 55, 0.65)';
              ctx.lineWidth = 2 * S;
              ctx.beginPath();
              ctx.moveTo(bannerX - bw / 2 + 36 * S, bannerY - bh / 2);
              ctx.lineTo(bannerX + bw / 2 - 36 * S, bannerY - bh / 2);
              ctx.moveTo(bannerX - bw / 2 + 36 * S, bannerY + bh / 2);
              ctx.lineTo(bannerX + bw / 2 - 36 * S, bannerY + bh / 2);
              ctx.stroke();
            } else if (nameStyle === 'circle') {
              const radius = 76 * S;
              ctx.beginPath();
              ctx.arc(bannerX, bannerY, radius, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
              ctx.fill();
              ctx.strokeStyle = 'rgba(212, 175, 55, 0.7)';
              ctx.lineWidth = 3 * S;
              ctx.stroke();
              ctx.beginPath();
              ctx.arc(bannerX, bannerY, radius - 8 * S, 0, Math.PI * 2);
              ctx.strokeStyle = 'rgba(212, 175, 55, 0.35)';
              ctx.lineWidth = 1 * S;
              ctx.stroke();
            } else if (nameStyle === 'diamond') {
              const ds = 78 * S;
              ctx.beginPath();
              ctx.moveTo(bannerX, bannerY - ds);
              ctx.lineTo(bannerX + ds * 1.8, bannerY);
              ctx.lineTo(bannerX, bannerY + ds);
              ctx.lineTo(bannerX - ds * 1.8, bannerY);
              ctx.closePath();
              ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
              ctx.fill();
              ctx.strokeStyle = 'rgba(212, 175, 55, 0.7)';
              ctx.lineWidth = 2.5 * S;
              ctx.stroke();
            } else if (nameStyle === 'ribbon') {
              const rw = Math.min(460 * S, W * 0.78), rh = 76 * S;
              const rx = bannerX - rw / 2;
              ctx.beginPath();
              ctx.moveTo(rx + 22 * S, bannerY - rh / 2);
              ctx.lineTo(rx + rw - 22 * S, bannerY - rh / 2);
              ctx.lineTo(rx + rw, bannerY);
              ctx.lineTo(rx + rw - 22 * S, bannerY + rh / 2);
              ctx.lineTo(rx + 22 * S, bannerY + rh / 2);
              ctx.lineTo(rx, bannerY);
              ctx.closePath();
              ctx.fillStyle = 'rgba(212, 175, 55, 0.22)';
              ctx.fill();
              ctx.strokeStyle = 'rgba(212, 175, 55, 0.75)';
              ctx.lineWidth = 2.5 * S;
              ctx.stroke();
            } else if (nameStyle === 'calligraphy') {
              ctx.fillStyle = 'rgba(212, 175, 55, 0.65)';
              [-110, -70, 70, 110].forEach(dx => {
                ctx.beginPath();
                ctx.arc(bannerX + dx * S, bannerY - 34 * S, 3.5 * S, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(bannerX + dx * S, bannerY + 34 * S, 3.5 * S, 0, Math.PI * 2);
                ctx.fill();
              });
            } else if (nameStyle === 'modern') {
              const mw = Math.min(460 * S, W * 0.72), mh = 76 * S;
              ctx.fillStyle = 'rgba(10, 25, 35, 0.65)';
              safeRoundRect(ctx, bannerX - mw / 2, bannerY - mh / 2, mw, mh, 38 * S);
              ctx.fill();
              ctx.strokeStyle = '#FFD700';
              ctx.lineWidth = 2 * S;
              ctx.stroke();
            } else if (nameStyle === 'ornate') {
              const ow = Math.min(480 * S, W * 0.75), oh = 82 * S;
              ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
              ctx.fillRect(bannerX - ow / 2, bannerY - oh / 2, ow, oh);
              ctx.strokeStyle = '#D4AF37';
              ctx.lineWidth = 2.5 * S;
              ctx.strokeRect(bannerX - ow / 2, bannerY - oh / 2, ow, oh);
              const ins = 7 * S;
              ctx.strokeStyle = 'rgba(212, 175, 55, 0.5)';
              ctx.lineWidth = 1 * S;
              ctx.strokeRect(bannerX - ow / 2 + ins, bannerY - oh / 2 + ins, ow - ins * 2, oh - ins * 2);
            } else if (nameStyle === 'minimal') {
              ctx.strokeStyle = 'rgba(212, 175, 55, 0.75)';
              ctx.lineWidth = 2 * S;
              ctx.beginPath();
              ctx.moveTo(bannerX - 130 * S, bannerY + 30 * S);
              ctx.lineTo(bannerX + 130 * S, bannerY + 30 * S);
              ctx.stroke();
            } else {
              // classic (Default) - Double-bordered rounded badge
              const badgeWidth = Math.min(380 * S, W * 0.72);
              const badgeHeight = 96 * S;
              ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
              safeRoundRect(ctx, bannerX - badgeWidth / 2, bannerY - badgeHeight / 2, badgeWidth, badgeHeight, 48 * S);
              ctx.fill();
              ctx.strokeStyle = 'rgba(212, 175, 55, 0.55)';
              ctx.lineWidth = 3 * S;
              ctx.stroke();
              ctx.strokeStyle = 'rgba(212, 175, 55, 0.3)';
              ctx.lineWidth = 1 * S;
              safeRoundRect(ctx, bannerX - (badgeWidth - 12 * S) / 2, bannerY - (badgeHeight - 12 * S) / 2, badgeWidth - 12 * S, badgeHeight - 12 * S, 42 * S);
              ctx.stroke();
            }

            const rawName = manifest.canonicalAyahRange?.surahName || manifest.surah?.name || '';
            const cleanName = rawName.replace(/^سُ?ورَ?ةُ?\s+/i, '').trim();
            const titleText = cleanName ? `سُورَةُ ${cleanName}` : (rawName || 'القرآن الكريم');

            ctx.font = `bold ${Math.round(36 * S)}px "Amiri", "Scheherazade New", serif`;
            ctx.fillStyle = '#D4AF37';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
            ctx.shadowBlur = 10 * S;
            ctx.fillText(titleText, bannerX, bannerY);
            ctx.restore();
          }

          // 5b. Subtitle / Reciter Name (Independent of showSurahName)
          const reciterRaw = manifest.reciter?.name || manifest.canonicalAyahRange?.reciterName || '';
          let headerBottomY = bannerY;
          if (displaySettings.showReciterName && reciterRaw) {
            ctx.save();
            let reciterX = headerLayout.reciterX;
            let reciterY = headerLayout.reciterY;

            headerBottomY = reciterY;

            const reciterStyle = displaySettings.reciterNameStyle || 'simple';
            const cleanReciter = reciterRaw.replace(/^بصوت\s+/i, '').trim();
            const reciterText = `بصوت ${cleanReciter}`;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (reciterStyle === 'badge') {
              ctx.font = `${Math.round(22 * S)}px "Amiri", "Noto Naskh Arabic", sans-serif`;
              const tw = ctx.measureText(reciterText).width;
              const bw = tw + 48 * S, bh = 40 * S;
              ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
              safeRoundRect(ctx, reciterX - bw / 2, reciterY - bh / 2, bw, bh, 20 * S);
              ctx.fill();
              ctx.strokeStyle = 'rgba(212, 175, 55, 0.55)';
              ctx.lineWidth = 1.5 * S;
              ctx.stroke();
              ctx.fillStyle = '#FFFFFF';
              ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
              ctx.shadowBlur = 4 * S;
            } else if (reciterStyle === 'glow') {
              ctx.font = `${Math.round(24 * S)}px "Amiri", "Noto Naskh Arabic", sans-serif`;
              ctx.fillStyle = '#FFD700';
              ctx.shadowColor = '#D4AF37';
              ctx.shadowBlur = 16 * S;
            } else if (reciterStyle === 'elegant') {
              ctx.font = `italic bold ${Math.round(25 * S)}px "Amiri", "Scheherazade New", serif`;
              ctx.fillStyle = '#D4AF37';
              ctx.shadowColor = 'rgba(212, 175, 55, 0.45)';
              ctx.shadowBlur = 8 * S;
            } else if (reciterStyle === 'pill') {
              ctx.font = `${Math.round(22 * S)}px "Amiri", "Noto Naskh Arabic", sans-serif`;
              const tw = ctx.measureText(reciterText).width;
              const bw = tw + 40 * S, bh = 38 * S;
              ctx.fillStyle = 'rgba(10, 25, 35, 0.7)';
              safeRoundRect(ctx, reciterX - bw / 2, reciterY - bh / 2, bw, bh, 19 * S);
              ctx.fill();
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
              ctx.lineWidth = 1.5 * S;
              ctx.stroke();
              ctx.fillStyle = '#FFFFFF';
            } else if (reciterStyle === 'gold') {
              ctx.font = `bold ${Math.round(22 * S)}px "Amiri", "Noto Naskh Arabic", sans-serif`;
              const tw = ctx.measureText(reciterText).width;
              const bw = tw + 36 * S, bh = 38 * S;
              ctx.fillStyle = '#D4AF37';
              safeRoundRect(ctx, reciterX - bw / 2, reciterY - bh / 2, bw, bh, 10 * S);
              ctx.fill();
              ctx.fillStyle = '#040D12';
              ctx.shadowBlur = 0;
            } else if (reciterStyle === 'bordered') {
              ctx.font = `${Math.round(22 * S)}px "Amiri", "Noto Naskh Arabic", sans-serif`;
              const tw = ctx.measureText(reciterText).width;
              const bw = tw + 36 * S, bh = 38 * S;
              ctx.strokeStyle = '#D4AF37';
              ctx.lineWidth = 2 * S;
              safeRoundRect(ctx, reciterX - bw / 2, reciterY - bh / 2, bw, bh, 8 * S);
              ctx.stroke();
              ctx.fillStyle = '#FFD700';
            } else if (reciterStyle === 'tag') {
              ctx.font = `bold ${Math.round(21 * S)}px "Amiri", "Noto Naskh Arabic", sans-serif`;
              const tw = ctx.measureText(reciterText).width;
              const pw = 48 * S, ph = 38 * S;
              const tx = reciterX - (tw + pw) / 2;
              ctx.fillStyle = 'rgba(212, 175, 55, 0.22)';
              ctx.beginPath();
              ctx.moveTo(tx + 16 * S, reciterY - ph / 2);
              ctx.lineTo(tx + tw + pw, reciterY - ph / 2);
              ctx.lineTo(tx + tw + pw, reciterY + ph / 2);
              ctx.lineTo(tx + 16 * S, reciterY + ph / 2);
              ctx.lineTo(tx, reciterY);
              ctx.closePath();
              ctx.fill();
              ctx.strokeStyle = 'rgba(212, 175, 55, 0.65)';
              ctx.lineWidth = 1.5 * S;
              ctx.stroke();
              ctx.fillStyle = '#FFFFFF';
              reciterX += 6 * S;
            } else {
              // simple
              ctx.font = `${Math.round(23 * S)}px "Amiri", "Noto Naskh Arabic", sans-serif`;
              ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
              ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
              ctx.shadowBlur = 6 * S;
            }

            ctx.fillText(reciterText, reciterX, reciterY);
            ctx.restore();
          }

          // 5c. Decorative separator ornament line under header
          if ((displaySettings.showSurahName || (displaySettings.showReciterName && reciterRaw)) && pos !== 'bottom') {
            ctx.save();
            const sepY = headerLayout.separatorY;
            const sepX = displaySettings.showReciterName && reciterRaw ? headerLayout.reciterX : headerLayout.titleX;
            const lineHalf = 110 * S;
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.5)';
            ctx.lineWidth = 1.5 * S;
            ctx.beginPath();
            ctx.moveTo(sepX - lineHalf, sepY);
            ctx.lineTo(sepX - 14 * S, sepY);
            ctx.moveTo(sepX + 14 * S, sepY);
            ctx.lineTo(sepX + lineHalf, sepY);
            ctx.stroke();

            // Center gold diamond
            ctx.fillStyle = '#D4AF37';
            ctx.beginPath();
            ctx.moveTo(sepX, sepY - 5 * S);
            ctx.lineTo(sepX + 6 * S, sepY);
            ctx.lineTo(sepX, sepY + 5 * S);
            ctx.lineTo(sepX - 6 * S, sepY);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }

          // 6. Active Ayah Selection & Timeline Synchronization
          let activeAyahIndex = 0;
          let currentAyahStartSec = 0;
          let currentAyahEndSec = manifest.audio.durationSeconds;

          // Method A: Exact EveryAyah timestamps
          const hasEveryAyahTimeline = Boolean(manifest.audio.everyAyahTimestamps && manifest.audio.everyAyahTimestamps.length > 0);
          if (hasEveryAyahTimeline) {
            const ts = manifest.audio.everyAyahTimestamps;
            for (let i = ts.length - 1; i >= 0; i--) {
              const fromSec = ts[i].from > 1000 ? ts[i].from / 1000 : ts[i].from;
              if (frameTimeSeconds >= fromSec) {
                activeAyahIndex = i;
                currentAyahStartSec = fromSec;
                currentAyahEndSec = ts[i].to > 1000 ? ts[i].to / 1000 : ts[i].to;
                break;
              }
            }
          }
          // Method B: Canonical verse ranges stay valid even if one damaged
          // upstream word span is absent. They also prevent early ayah changes
          // while the reciter is still holding the previous verse.
          const compositionOffsets = !hasEveryAyahTimeline && timingMap && Array.isArray(timingMap.compositionOffsets)
            ? timingMap.compositionOffsets.filter(offset => (
              offset && Number.isFinite(offset.startMs) && Number.isFinite(offset.endMs) && offset.endMs > offset.startMs
            ))
            : [];
          let activeCompositionOffset = null;
          for (let i = compositionOffsets.length - 1; i >= 0; i--) {
            const offset = compositionOffsets[i];
            if (lookupTimeMs >= offset.startMs && lookupTimeMs < offset.endMs) {
              activeCompositionOffset = offset;
              const foundIdx = allAyahs.findIndex(a => a.numberInSurah === offset.ayahNumber);
              if (foundIdx !== -1) activeAyahIndex = foundIdx;
              currentAyahStartSec = Math.max(0, (offset.startMs - (isTimingMapAbsolute ? rangeOffsetMs : 0)) / 1000);
              currentAyahEndSec = Math.min(manifest.audio.durationSeconds, (offset.endMs - (isTimingMapAbsolute ? rangeOffsetMs : 0)) / 1000);
              break;
            }
          }
          // Method C: TimingMap words with canonicalWordKey using lookupTimeMs.
          if (!hasEveryAyahTimeline && !activeCompositionOffset && timingMap && timingMap.words && timingMap.words.length > 0) {
            const words = timingMap.words;
            let foundWord = null;
            for (let i = words.length - 1; i >= 0; i--) {
              if (lookupTimeMs >= words[i].startMs) {
                foundWord = words[i];
                break;
              }
            }
            if (foundWord && foundWord.canonicalWordKey) {
              const parts = foundWord.canonicalWordKey.split(':');
              if (parts.length >= 2) {
                const ayahNum = parseInt(parts[1], 10);
                const foundIdx = allAyahs.findIndex(a => a.numberInSurah === ayahNum);
                if (foundIdx !== -1) {
                  activeAyahIndex = foundIdx;
                }
              }
            }

            // Bound currentAyahStartSec and currentAyahEndSec based on timing map words
            const activeAyahObj = allAyahs[activeAyahIndex] || allAyahs[0];
            const ayahWordsInMap = words.filter(w => {
              if (!w.canonicalWordKey) return false;
              const p = w.canonicalWordKey.split(':');
              return parseInt(p[1], 10) === activeAyahObj.numberInSurah;
            });
            if (ayahWordsInMap.length > 0) {
              const firstMs = ayahWordsInMap[0].startMs;
              const lastMs = ayahWordsInMap[ayahWordsInMap.length - 1].endMs;
              currentAyahStartSec = Math.max(0, (firstMs - (isTimingMapAbsolute ? rangeOffsetMs : 0)) / 1000);
              currentAyahEndSec = Math.min(manifest.audio.durationSeconds, (lastMs - (isTimingMapAbsolute ? rangeOffsetMs : 0)) / 1000);
            }
          }
          // Method D: No timing evidence. Keep a stable static verse rather
          // than slicing duration across ayahs and presenting that estimate as
          // recitation synchronization. Word animation remains disabled below.
          else if (!hasEveryAyahTimeline && allAyahs.length > 1) {
            activeAyahIndex = 0;
            currentAyahStartSec = 0;
            currentAyahEndSec = manifest.audio.durationSeconds;
          }

          const activeAyah = allAyahs[activeAyahIndex] || allAyahs[0];
          const activeAyahDurationSec = Math.max(currentAyahEndSec - currentAyahStartSec, 0.5);
          const timeInAyahSec = Math.max(frameTimeSeconds - currentAyahStartSec, 0);

          // 7. Word-Level Highlighting Resolution
          const ayahWords = (activeAyah.text || '').split(/\s+/).filter(word => stripTashkeel(word).replace(/[\u0640\s]/g, '').length > 0);
          let activeWordIndexInAyah = null;
          let activeWordProgress = 0;
          const animationProfile = normalizeAnimationProfile(
            manifest.animationProfile || displaySettings.animationProfile || 'karaoke'
          );
          const animationReducedMotion = manifest.animationReducedMotion === true || displaySettings.animationReducedMotion === true;
          const hasTrustedWordTiming = Boolean(
            timingMap && timingMap.validationStatus === 'approved' && timingMap.words && timingMap.words.length > 0
          );

          // Case A: Aligned TimingMap has explicit words
          if (hasTrustedWordTiming) {
            const words = timingMap.words;
            let activeWord = null;

            // Binary search active word
            let low = 0;
            let high = words.length - 1;
            while (low <= high) {
              const mid = Math.floor((low + high) / 2);
              const w = words[mid];
              if (lookupTimeMs >= w.startMs && lookupTimeMs < w.endMs) {
                activeWord = w;
                const dur = Math.max(w.endMs - w.startMs, 1);
                activeWordProgress = Math.min(Math.max((lookupTimeMs - w.startMs) / dur, 0), 1);
                break;
              } else if (lookupTimeMs < w.startMs) {
                high = mid - 1;
              } else {
                low = mid + 1;
              }
            }

            // Waqf-holding during pauses
            if (!activeWord && lookupTimeMs >= words[0].startMs) {
              for (let i = words.length - 1; i >= 0; i--) {
                if (lookupTimeMs >= words[i].endMs) {
                  activeWord = words[i];
                  activeWordProgress = 1.0;
                  break;
                }
              }
            }

            if (activeWord && activeWord.canonicalWordKey) {
              const parts = activeWord.canonicalWordKey.split(':');
              const wAyahNum = parseInt(parts[1], 10);
              const wIndex1Based = parseInt(parts[2], 10);
              if (wAyahNum === activeAyah.numberInSurah) {
                activeWordIndexInAyah = wIndex1Based - 1;
              } else if (wAyahNum < activeAyah.numberInSurah) {
                // Hold the previous ayah's event through the inter-ayah pause;
                // never reveal the next ayah's first word before its own span.
                activeWordIndexInAyah = null;
                activeWordProgress = 0;
              }
            } else if (activeWord && typeof activeWord.displayWordIndex === 'number') {
              activeWordIndexInAyah = activeWord.displayWordIndex % Math.max(ayahWords.length, 1);
            }
          }

          // Unaligned audio deliberately has no word event. An animation
          // profile may still choose its static presentation, but it cannot
          // manufacture a word boundary from duration, WPM, or token shape.

          // Timed Ibtahalat lyrics are part of the scene contract, not a
          // React-only overlay. They intentionally bypass Quran word/chunk
          // rendering while preserving the same headers, frame, timeline,
          // branding, and output clock used by every renderer.
          const lyricLines = manifest.contentKind === 'lyrics' && Array.isArray(manifest.lyrics)
            ? manifest.lyrics.filter(line => line && typeof line.text === 'string' && line.text.trim())
            : null;
          let activeLyricsIndex = 0;
          if (lyricLines && lyricLines.length > 0) {
            for (let i = lyricLines.length - 1; i >= 0; i--) {
              if (frameTimeSeconds >= Number(lyricLines[i].start || 0)) {
                activeLyricsIndex = i;
                break;
              }
            }
          }

          if (lyricLines && lyricLines.length > 0 && displaySettings.showAyahText !== false) {
            const lyricStyle = displaySettings.lyricsDisplayStyle || 'scroll';
            const fontFamily = resolveFontFamily(typography.fontFamily);
            const baseLyricSize = Math.max(14 * S, (Number(typography.fontSize || 28) * 1.6 * S));
            const lyricLineHeight = baseLyricSize * 2.2;
            const centerY = H * 0.52;
            const maxTextWidth = W * 0.82;
            const fitLyricSize = (line, requestedSize) => {
              let size = requestedSize;
              ctx.font = `bold ${Math.round(size)}px "${fontFamily}", "Amiri", serif`;
              while (ctx.measureText(line).width > maxTextWidth && size > 14 * S) {
                size -= 1 * S;
                ctx.font = `bold ${Math.round(size)}px "${fontFamily}", "Amiri", serif`;
              }
              return size;
            };
            const drawLyricLine = (line, x, y, requestedSize, isCurrent, alpha = 1) => {
              const size = fitLyricSize(line, requestedSize);
              ctx.save();
              ctx.globalAlpha = alpha;
              ctx.direction = 'rtl';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.font = `${isCurrent ? 'bold ' : ''}${Math.round(size)}px "${fontFamily}", "Amiri", serif`;
              if (isCurrent) {
                const pulse = 0.6 + Math.sin(frameTimeSeconds * 2.5) * 0.4;
                const glowStyle = displaySettings.glowStyle || 'golden';
                const glowColor = glowStyle === 'neon' ? '#00FFFF'
                  : glowStyle === 'emerald' ? '#10B981'
                    : glowStyle === 'royal' ? '#A855F7'
                      : glowStyle === 'soft' ? '#FFFFFF' : '#FFD700';
                const textColor = glowStyle === 'neon' ? '#DFFFFF'
                  : glowStyle === 'emerald' ? '#D1FAE5'
                    : glowStyle === 'royal' ? '#F3E8FF'
                      : glowStyle === 'soft' ? '#FFFFFF' : '#FFD700';
                const width = ctx.measureText(line).width;
                const pad = 24 * S;
                const gradient = ctx.createLinearGradient(x - width / 2 - pad, y, x + width / 2 + pad, y);
                gradient.addColorStop(0, 'rgba(212, 175, 55, 0)');
                gradient.addColorStop(0.5, `rgba(212, 175, 55, ${0.10 + pulse * 0.10})`);
                gradient.addColorStop(1, 'rgba(212, 175, 55, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(x - width / 2 - pad, y - size * 0.72, width + pad * 2, size * 1.45);
                if (displaySettings.glowStyle === 'none') {
                  ctx.fillStyle = typography.textColor || '#FFFFFF';
                  ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                  ctx.shadowBlur = 5 * S;
                } else {
                  ctx.fillStyle = textColor;
                  ctx.shadowColor = glowColor;
                  ctx.shadowBlur = (18 + pulse * 18) * S;
                }
                ctx.fillText(line, x, y);
                if (displaySettings.glowStyle !== 'none') {
                  ctx.shadowBlur *= 0.45;
                  ctx.fillText(line, x, y);
                }
              } else {
                ctx.fillStyle = typography.textColor || '#FFFFFF';
                ctx.shadowColor = `rgba(0, 0, 0, ${(typography.shadowIntensity ?? 0.5) * 0.7})`;
                ctx.shadowBlur = 5 * S;
                ctx.fillText(line, x, y);
              }
              ctx.restore();
            };

            let visibleStart = activeLyricsIndex;
            let visibleEnd = activeLyricsIndex + 1;
            let visibleLines = [lyricLines[activeLyricsIndex].text];
            if (lyricStyle === 'scroll') {
              const maxVisible = Math.min(7, lyricLines.length);
              const half = Math.floor(maxVisible / 2);
              visibleStart = Math.max(0, activeLyricsIndex - half);
              visibleEnd = Math.min(lyricLines.length, visibleStart + maxVisible);
              if (visibleEnd - visibleStart < maxVisible) visibleStart = Math.max(0, visibleEnd - maxVisible);
              visibleLines = lyricLines.slice(visibleStart, visibleEnd).map(line => line.text);
            } else if (lyricStyle === 'karaoke') {
              visibleStart = Math.max(0, Math.min(activeLyricsIndex - 1, lyricLines.length - 3));
              visibleEnd = Math.min(lyricLines.length, visibleStart + 3);
              visibleLines = lyricLines.slice(visibleStart, visibleEnd).map(line => line.text);
            } else if (lyricStyle === 'fade' || lyricStyle === 'single') {
              visibleLines = [lyricLines[activeLyricsIndex].text];
            }

            ctx.font = `bold ${Math.round(baseLyricSize)}px "${fontFamily}", "Amiri", serif`;
            const widest = Math.max(W * 0.56, ...visibleLines.map(line => Math.min(ctx.measureText(line).width, maxTextWidth)));
            const visibleHeight = lyricStyle === 'single' || lyricStyle === 'fade'
              ? baseLyricSize * 1.8
              : Math.max(lyricLineHeight, visibleLines.length * lyricLineHeight);
            let lyricTop = centerY - visibleHeight / 2;
            const lyricFrame = getResponsiveTextFrameLayout({
              canvasWidth: W,
              canvasHeight: H,
              contentTop: lyricTop,
              contentBottom: lyricTop + visibleHeight,
              contentWidth: widest,
              scale: S,
              safeTopRatio: 0.14,
              safeBottomRatio: 0.88,
            });
            lyricTop += lyricFrame.offsetY;
            if (displaySettings.frameStyle && displaySettings.frameStyle !== 'none') {
              drawIslamicFrame(ctx, lyricFrame.frameX, lyricFrame.frameY, lyricFrame.frameWidth, lyricFrame.frameHeight, displaySettings.frameStyle, S);
            }

            if (lyricStyle === 'single' || lyricStyle === 'fade') {
              const line = lyricLines[activeLyricsIndex].text;
              let alpha = 1;
              if (lyricStyle === 'fade') {
                const lineDuration = Math.max(Number(lyricLines[activeLyricsIndex].end || 0) - Number(lyricLines[activeLyricsIndex].start || 0), 0.1);
                const local = Math.max(0, Math.min(1, (frameTimeSeconds - Number(lyricLines[activeLyricsIndex].start || 0)) / lineDuration));
                alpha = Math.min(1, Math.max(0.2, local < 0.15 ? local / 0.15 : local > 0.85 ? (1 - local) / 0.15 : 1));
              }
              drawLyricLine(line, W / 2, lyricTop + visibleHeight / 2, baseLyricSize * (lyricStyle === 'single' ? 1.3 : 1.2), true, alpha);
              if (lyricStyle === 'single') {
                ctx.save();
                ctx.font = `${Math.round(14 * S)}px "${fontFamily}", sans-serif`;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.textAlign = 'center';
                ctx.fillText(`${activeLyricsIndex + 1} / ${lyricLines.length}`, W / 2, lyricTop + visibleHeight / 2 + baseLyricSize * 1.35);
                ctx.restore();
              }
            } else {
              const startY = lyricTop + lyricLineHeight / 2;
              for (let i = visibleStart; i < visibleEnd; i++) {
                const distance = Math.abs(i - activeLyricsIndex);
                drawLyricLine(lyricLines[i].text, W / 2, startY + (i - visibleStart) * lyricLineHeight,
                  baseLyricSize, i === activeLyricsIndex, i === activeLyricsIndex ? 1 : Math.max(0.22, 0.72 - distance * 0.16));
              }
            }
          }

          // 8. Verse Display Modes & Chunks (full, twoWords, threeTwo, wordByWord)
          // A word/chunk mode is meaningful only when the server-attested map has
          // explicit word spans.  An unreviewed/provisional map must never fall
          // through to the first word or a guessed chunk: render the whole ayah
          // until an approved alignment is available.
          if (!lyricLines) {
          const requestedVerseMode = displaySettings.verseDisplayMode || 'full';
          const verseMode = hasTrustedWordTiming ? requestedVerseMode : 'full';
          // A trusted map can still have a short, legitimate inter-ayah gap
          // between the verse boundary and the first word event.  Do not turn
          // that gap into an empty canvas: keep the complete current ayah
          // visible until its first verified word starts.  This is a display
          // safety rule only; it never invents a highlight or a timestamp.
          const verseWordWindow = activeWordIndexInAyah == null && hasTrustedWordTiming
            ? { startIndex: 0, wordCount: ayahWords.length }
            : resolveVerseWordWindow(verseMode, ayahWords.length, activeWordIndexInAyah);
          let chunkStartWordIdx = verseWordWindow.startIndex;
          let displayWords = ayahWords.slice(
            verseWordWindow.startIndex,
            verseWordWindow.startIndex + verseWordWindow.wordCount,
          );

          // QUA supplies an optional letter tier for the same word events. In
          // letter-by-letter mode reveal only the letters whose trusted spans
          // have started; if a different provider has no letter tier, fail
          // closed to the complete active word rather than inventing timing.
          if (hasTrustedWordTiming && verseMode === 'letterByLetter' && activeWordIndexInAyah != null) {
            const activeCanonical = `${manifest.canonicalAyahRange?.surahNumber}:${activeAyah.numberInSurah}:${activeWordIndexInAyah + 1}`;
            const activeTimingWord = timingMap.words.find(word => word.canonicalWordKey === activeCanonical);
            const letterSpans = activeTimingWord && Array.isArray(activeTimingWord.letters) ? activeTimingWord.letters : [];
            const sourceWord = ayahWords[activeWordIndexInAyah] || activeTimingWord?.displayToken || '';
            if (letterSpans.length > 0) {
              const revealed = letterSpans
                .filter(letter => lookupTimeMs >= letter.startMs)
                .map(letter => letter.token)
                .join('');
              displayWords = [revealed || sourceWord.charAt(0) || sourceWord];
            } else {
              displayWords = [sourceWord];
            }
            chunkStartWordIdx = activeWordIndexInAyah;
          }

          // Teleprompter/isolate choose their own reading window only when the
          // user asked for a full ayah. An explicit word/chunk mode stays the
          // controlling layout; the profile then changes only its visual state.
          if (hasTrustedWordTiming && verseMode === 'full' && animationProfile === 'teleprompter' && ayahWords.length > 0) {
            const center = activeWordIndexInAyah == null ? 0 : Math.max(0, Math.min(activeWordIndexInAyah, ayahWords.length - 1));
            chunkStartWordIdx = Math.max(0, Math.min(center - 2, ayahWords.length - 5));
            displayWords = ayahWords.slice(chunkStartWordIdx, chunkStartWordIdx + 5);
          } else if (hasTrustedWordTiming && verseMode === 'full' && animationProfile === 'isolate' && activeWordIndexInAyah != null && ayahWords[activeWordIndexInAyah]) {
            chunkStartWordIdx = activeWordIndexInAyah;
            displayWords = [ayahWords[activeWordIndexInAyah]];
          }

          // 9. Render Quranic Ayah Text with Entrance Transitions
          if (displaySettings.showAyahText !== false && activeAyah) {
            ctx.save();

            // Smooth entrance motion for the first 500ms of the verse
            let transType = displaySettings.ayahTransition || 'fade';
            if (transType === 'random') {
              const transChoices = ['fade', 'slide', 'zoom', 'rise', 'rotate', 'cinematic', 'elastic', 'blur'];
              transType = transChoices[activeAyahIndex % transChoices.length];
            }
            const enterDuration = 0.5;
            const enterProgress = Math.min(timeInAyahSec / enterDuration, 1.0);
            const easedEnter = 1 - Math.pow(1 - enterProgress, 3);

            if (transType === 'none') {
              // Direct display
            } else if (transType === 'fade' || transType === 'blur') {
              ctx.globalAlpha = easedEnter;
            } else if (transType === 'slide') {
              ctx.translate(0, (1 - easedEnter) * 50 * S);
              ctx.globalAlpha = easedEnter;
            } else if (transType === 'zoom') {
              const s = 0.88 + easedEnter * 0.12;
              ctx.translate(W / 2 * (1 - s), H * 0.52 * (1 - s));
              ctx.scale(s, s);
              ctx.globalAlpha = easedEnter;
            } else if (transType === 'rise') {
              ctx.translate(0, (1 - easedEnter) * 70 * S);
              ctx.globalAlpha = easedEnter;
            } else if (transType === 'rotate') {
              const rotAngle = (1 - easedEnter) * 0.04;
              ctx.translate(W / 2, H * 0.52);
              ctx.rotate(rotAngle);
              ctx.translate(-W / 2, -H * 0.52);
              ctx.globalAlpha = easedEnter;
            } else if (transType === 'cinematic') {
              const s = 0.94 + easedEnter * 0.06;
              ctx.translate(W / 2 * (1 - s), H * 0.52 * (1 - s));
              ctx.scale(s, s);
              ctx.globalAlpha = Math.min(easedEnter * 1.1, 1.0);
            } else if (transType === 'elastic') {
              const p = enterProgress;
              const elasticEase = p === 1 ? 1 : -Math.pow(2, 10 * (p - 1)) * Math.sin((p - 1.1) * 5 * Math.PI);
              const clampedS = 0.86 + Math.min(Math.max(elasticEase, 0), 1.15) * 0.14;
              ctx.translate(W / 2 * (1 - clampedS), H * 0.52 * (1 - clampedS));
              ctx.scale(clampedS, clampedS);
              ctx.globalAlpha = easedEnter;
            }

            const fontFamily = resolveFontFamily(typography.fontFamily);
            const modeScales = { letterByLetter: 2.9, wordByWord: 2.7, twoWords: 2.5, threeTwo: 2.3, full: 1.9 };
            const fontScale = modeScales[verseMode] || 1.9;
            const baseFontSize = (typography.fontSize || 28) * fontScale * S;
            let effectiveFontSize = baseFontSize;
            let lineHeight = baseFontSize * (verseMode === 'full' ? 2.3 : 1.8);

            ctx.font = `normal ${Math.round(baseFontSize)}px "${fontFamily}", "Amiri", serif`;
            ctx.direction = 'rtl';
            ctx.textAlign = 'right';

            let spaceWidth = ctx.measureText(' ').width;
            const hasTextFrame = displaySettings.frameStyle && displaySettings.frameStyle !== 'none';
            const textFrameMargin = hasTextFrame ? 85 * S : 0;
            const maxLineWidth = Math.max(W * 0.82 - textFrameMargin, 260 * S);
            let lines = wrapArabicText(ctx, displayWords, maxLineWidth, spaceWidth);
            let totalTextHeight = lines.length * lineHeight;

            // Match the browser's responsive frame fitting rule. This prevents
            // the cloud render from using a larger font than the frame was
            // measured against, which was most visible on landscape 16:9.
            const framePaddingEstimate = Math.max(20 * S, Math.min(65 * S, W * 0.045));
            const badgeFootprint = displaySettings.showAyahNumber !== false
              ? ((verseMode === 'full' ? 36 : 28) + (verseMode === 'full' ? 40 : 24) + 16) * S
              : 16 * S;
            const hasTopHeader = (displaySettings.showSurahName || displaySettings.showReciterName) && pos !== 'bottom';
            const hasBottomHeader = (displaySettings.showSurahName || displaySettings.showReciterName) && pos === 'bottom';
            const verseSafeTop = hasTopHeader ? headerLayout.separatorY + 28 * S : H * 0.14;
            const verseSafeBottom = hasBottomHeader ? headerLayout.separatorY - 28 * S : H * 0.88;
            const maxAllowedHeight = Math.max(
              lineHeight,
              verseSafeBottom - verseSafeTop - (hasTextFrame ? framePaddingEstimate * 2 : 0) - badgeFootprint,
            );
            if (totalTextHeight > maxAllowedHeight && lines.length > 1) {
              const scaleDown = Math.max(0.52, Math.min(1, maxAllowedHeight / totalTextHeight));
              effectiveFontSize = baseFontSize * scaleDown;
              lineHeight *= scaleDown;
              ctx.font = `normal ${Math.round(effectiveFontSize)}px "${fontFamily}", "Amiri", serif`;
              spaceWidth = ctx.measureText(' ').width;
              lines = wrapArabicText(ctx, displayWords, maxLineWidth, spaceWidth);
              totalTextHeight = lines.length * lineHeight;
            }
            const ayahY = (verseSafeTop + verseSafeBottom) / 2;
            let startY = ayahY - totalTextHeight / 2;

            const measuredLineWidth = Math.max(
              ...lines.map((line) => line.reduce((sum, word) => sum + ctx.measureText(word).width, 0) + Math.max(line.length - 1, 0) * spaceWidth),
              maxLineWidth * 0.58,
            );
            const badgeSize = (verseMode !== 'full' ? 28 : 36) * S;
            const badgeGap = (verseMode !== 'full' ? 24 : 40) * S;
            let badgeY = displaySettings.showAyahNumber !== false
              ? Math.max(Math.min(startY + totalTextHeight + badgeGap, H * 0.88), startY + totalTextHeight + 16 * S)
              : 0;

            const verseTop = startY - lineHeight / 2;
            const verseBottom = startY + totalTextHeight + lineHeight / 2 + badgeFootprint;
            let headerOffset = 0;
            if (verseTop < verseSafeTop) headerOffset += verseSafeTop - verseTop;
            if (verseBottom + headerOffset > verseSafeBottom) headerOffset += verseSafeBottom - (verseBottom + headerOffset);
            startY += headerOffset;
            if (displaySettings.showAyahNumber !== false) badgeY += headerOffset;

            // Draw the frame inside the same entrance transform as the verse and
            // include the ayah badge in its bounds so all three stay together.
            if (hasTextFrame) {
              const contentTop = startY - lineHeight / 2;
              const contentBottom = displaySettings.showAyahNumber !== false
                ? badgeY + badgeSize
                : startY + totalTextHeight + lineHeight / 2;
              const frameLayout = getResponsiveTextFrameLayout({
                canvasWidth: W,
                canvasHeight: H,
                contentTop,
                contentBottom,
                contentWidth: measuredLineWidth,
                scale: S,
                safeTopRatio: (displaySettings.showSurahName || displaySettings.showReciterName) && pos !== 'bottom'
                  ? Math.min(0.72, Math.max(0.14, (headerLayout.separatorY + 20 * S) / H))
                  : 0.14,
                safeBottomRatio: (displaySettings.showSurahName || displaySettings.showReciterName) && pos === 'bottom'
                  ? Math.max(0.28, Math.min(0.92, (headerLayout.separatorY - 20 * S) / H))
                  : 0.92,
              });
              // Keep the frame, verse, and ayah badge locked together.
              const fittedStartY = startY + frameLayout.offsetY;
              startY = fittedStartY;
              if (displaySettings.showAyahNumber !== false) badgeY += frameLayout.offsetY;
              drawIslamicFrame(ctx, frameLayout.frameX, frameLayout.frameY, frameLayout.frameWidth, frameLayout.frameHeight, displaySettings.frameStyle, S);
            }

            let wordCounterInChunk = 0;

            lines.forEach((lineWords, lineIdx) => {
              const lineTextWidth = lineWords.reduce((sum, w) => sum + ctx.measureText(w).width, 0) +
                Math.max(lineWords.length - 1, 0) * spaceWidth;
              let cursorX = W / 2 + lineTextWidth / 2;
              const y = startY + lineIdx * lineHeight + lineHeight / 2;

              lineWords.forEach((w) => {
                const wWidth = ctx.measureText(w).width;
                const globalWordIdx = chunkStartWordIdx + wordCounterInChunk;
                const hlStyle = displaySettings.highlightStyle ?? 'glow';
                const glowStyle = displaySettings.glowStyle || 'golden';
                const visualState = getAnimationState(
                  globalWordIdx,
                  activeWordIndexInAyah,
                  activeWordProgress,
                  hasTrustedWordTiming ? animationProfile : 'static',
                  ayahWords.length,
                  animationReducedMotion,
                );
                const isHighlighted = (hlStyle !== 'none') &&
                  hasTrustedWordTiming && visualState.isActive && visualState.emphasis > 0.5;

                ctx.save();
                ctx.globalAlpha *= visualState.opacity;
                if (visualState.scale !== 1 || visualState.translateY !== 0) {
                  const originX = cursorX - wWidth / 2;
                  ctx.translate(originX, y);
                  ctx.scale(visualState.scale, visualState.scale);
                  ctx.translate(-originX, -y + visualState.translateY);
                }
                if (isHighlighted) {
                  const pulse = 0.35 + Math.sin(Math.PI * activeWordProgress) * 0.65;
                  let glowColor = '#FFD700';
                  let textColor = '#FFF2A8';
                  let glowBlur = (24 + pulse * 28) * S;
                  let auraRgba = `rgba(255, 215, 0, ${0.25 + pulse * 0.25})`;

                  if (glowStyle === 'soft') {
                    glowColor = '#FFF5D6';
                    textColor = '#FFFFFF';
                    glowBlur = (20 + pulse * 22) * S;
                    auraRgba = `rgba(255, 250, 235, ${0.18 + pulse * 0.18})`;
                  } else if (glowStyle === 'neon') {
                    glowColor = '#00FFFF';
                    textColor = '#E0FFFF';
                    glowBlur = (26 + pulse * 30) * S;
                    auraRgba = `rgba(0, 255, 255, ${0.22 + pulse * 0.22})`;
                  } else if (glowStyle === 'pulse') {
                    glowColor = '#FFB800';
                    textColor = '#FFF8DB';
                    glowBlur = (28 + pulse * 38) * S;
                    auraRgba = `rgba(255, 184, 0, ${0.28 + pulse * 0.32})`;
                  } else if (glowStyle === 'emerald') {
                    glowColor = '#10B981';
                    textColor = '#D1FAE5';
                    glowBlur = (24 + pulse * 30) * S;
                    auraRgba = `rgba(16, 185, 129, ${0.24 + pulse * 0.26})`;
                  } else if (glowStyle === 'royal') {
                    glowColor = '#A855F7';
                    textColor = '#F3E8FF';
                    glowBlur = (24 + pulse * 30) * S;
                    auraRgba = `rgba(168, 85, 247, ${0.24 + pulse * 0.26})`;
                  }

                  if (hlStyle === 'glow') {
                    // Ambient glow backdrop gradient
                    const gPadX = 24 * S;
                    const gPadY = 14 * S;
                    const gGrad = ctx.createRadialGradient(cursorX - wWidth / 2, y, 0, cursorX - wWidth / 2, y, wWidth / 2 + gPadX);
                    gGrad.addColorStop(0, auraRgba);
                    gGrad.addColorStop(0.65, auraRgba.replace(/[\d\.]+\)$/, `${0.08 + pulse * 0.08})`));
                    gGrad.addColorStop(1, 'transparent');
                    ctx.fillStyle = gGrad;
                    ctx.fillRect(cursorX - wWidth - gPadX, y - baseFontSize * 0.85 - gPadY, wWidth + gPadX * 2, baseFontSize * 1.6 + gPadY * 2);

                    // First pass text with glow
                    ctx.fillStyle = textColor;
                    ctx.shadowColor = glowColor;
                    ctx.shadowBlur = glowBlur;
                    ctx.fillText(w, cursorX, y);

                    // Second pass for intense radiant bloom
                    ctx.shadowBlur = glowBlur * 0.5;
                    ctx.fillText(w, cursorX, y);
                  } else if (hlStyle === 'solid') {
                    const padX = 14 * S;
                    const padY = 8 * S;
                    ctx.fillStyle = glowStyle === 'emerald' ? 'rgba(16, 185, 129, 0.35)' :
                                    glowStyle === 'neon' ? 'rgba(0, 255, 255, 0.30)' :
                                    glowStyle === 'royal' ? 'rgba(168, 85, 247, 0.35)' :
                                    glowStyle === 'soft' ? 'rgba(255, 255, 255, 0.28)' :
                                    glowStyle === 'pulse' ? 'rgba(255, 184, 0, 0.35)' :
                                    'rgba(212, 175, 55, 0.35)';
                    if (ctx.roundRect) {
                      ctx.beginPath();
                      ctx.roundRect(cursorX - wWidth - padX, y - baseFontSize * 0.75 - padY, wWidth + padX * 2, baseFontSize * 1.3 + padY * 2, 12 * S);
                      ctx.fill();
                    } else {
                      ctx.fillRect(cursorX - wWidth - padX, y - baseFontSize * 0.75 - padY, wWidth + padX * 2, baseFontSize * 1.3 + padY * 2);
                    }
                    ctx.fillStyle = textColor;
                    ctx.fillText(w, cursorX, y);
                  } else if (hlStyle === 'underline') {
                    ctx.strokeStyle = glowColor;
                    ctx.lineWidth = 3.5 * S;
                    ctx.beginPath();
                    ctx.moveTo(cursorX - wWidth, y + baseFontSize * 0.55);
                    ctx.lineTo(cursorX, y + baseFontSize * 0.55);
                    ctx.stroke();
                    ctx.fillStyle = textColor;
                    ctx.fillText(w, cursorX, y);
                  } else {
                    ctx.fillStyle = textColor;
                    ctx.shadowColor = glowColor;
                    ctx.shadowBlur = 14 * S;
                    ctx.fillText(w, cursorX, y);
                  }
                } else {
                  // Non-highlighted word with customizable textShadowStyle
                  const shadowStyle = displaySettings.textShadowStyle || 'soft';
                  if (shadowStyle === 'none') {
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                  } else if (shadowStyle === 'strong') {
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
                    ctx.shadowBlur = 16 * S;
                    ctx.shadowOffsetX = 2 * S;
                    ctx.shadowOffsetY = 2 * S;
                  } else if (shadowStyle === 'glow') {
                    ctx.shadowColor = 'rgba(212, 175, 55, 0.55)';
                    ctx.shadowBlur = 16 * S;
                  } else if (shadowStyle === '3d' || shadowStyle === 'double') {
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
                    ctx.shadowBlur = 6 * S;
                    ctx.shadowOffsetX = 3 * S;
                    ctx.shadowOffsetY = 4 * S;
                  } else if (shadowStyle === 'outline') {
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.95)';
                    ctx.lineWidth = 3.5 * S;
                    ctx.strokeText(w, cursorX, y);
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                  } else {
                    // Soft
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
                    ctx.shadowBlur = 8 * S;
                    ctx.shadowOffsetX = 1 * S;
                    ctx.shadowOffsetY = 1 * S;
                  }
                  ctx.fillStyle = typography.textColor || '#FFFFFF';
                  ctx.fillText(w, cursorX, y);
                }

                ctx.restore();

                cursorX -= (wWidth + spaceWidth);
                wordCounterInChunk++;
              });
            });

            // 10. Ayah Rosette Number Badge
            if (displaySettings.showAyahNumber !== false) {
              drawAyahBadge(
                ctx,
                W / 2,
                badgeY,
                activeAyah.numberInSurah,
                badgeSize,
                displaySettings.ayahNumberStyle,
                displaySettings.ayahNumberColor
              );
            }

            ctx.restore(); // End verse entrance transition transform
          }
          }

          // 11. Sleek Audio Timeline Progress Indicator at Bottom
          const audioTotalDur = Math.max(manifest.audio.durationSeconds, 1);
          const timelineProgress = Math.min(Math.max(frameTimeSeconds / audioTotalDur, 0), 1);
          const barWidth = W * 0.65;
          const barHeight = 4 * S;
          const barX = (W - barWidth) / 2;
          const barY = H - 55 * S;

          // Track background
          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(barX, barY, barWidth, barHeight, 2 * S);
          else ctx.fillRect(barX, barY, barWidth, barHeight);
          ctx.fill();

          // Active progress fill
          ctx.fillStyle = '#D4AF37';
          ctx.shadowColor = '#FFD700';
          ctx.shadowBlur = 6 * S;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(barX, barY, barWidth * timelineProgress, barHeight, 2 * S);
          else ctx.fillRect(barX, barY, barWidth * timelineProgress, barHeight);
          ctx.fill();
          ctx.restore();

          // 12. Branding & Watermark (Dual Logo & Social Support)
          // 12.A: Circular / Custom Logo Watermark (Gold Medallion)
          const brandingLayout = getResponsiveBrandingLayout({
            W, H, S,
            logoPosition: displaySettings.logoWatermarkPosition || 'topRight',
            logoSize: displaySettings.logoWatermarkSize || 85,
            socialPosition: displaySettings.socialWatermarkPosition || displaySettings.watermarkPosition || 'bottomCenter',
            socialSize: displaySettings.socialWatermarkSize || 18,
            headerActive: Boolean(displaySettings.showSurahName || displaySettings.showReciterName),
            headerPosition: displaySettings.surahNamePosition || 'top',
            headerSeparatorY: headerLayout.separatorY,
            frameActive: Boolean(displaySettings.frameStyle && displaySettings.frameStyle !== 'none'),
          });
          if (displaySettings.logoWatermarkEnabled !== false) {
            ctx.save();
            const lPos = displaySettings.logoWatermarkPosition || 'topRight';
            const lSize = (displaySettings.logoWatermarkSize || 85) * S;
            const lOpacity = displaySettings.logoWatermarkOpacity != null ? displaySettings.logoWatermarkOpacity : 0.95;
            const lx = brandingLayout.logoX;
            const ly = brandingLayout.logoY;

            ctx.globalAlpha = lOpacity;
            const radius = brandingLayout.logoRadius;

            if (logoWatermarkImage && logoWatermarkImage.complete && logoWatermarkImage.naturalWidth > 0) {
              ctx.save();
              ctx.beginPath();
              ctx.arc(lx, ly, radius, 0, Math.PI * 2);
              ctx.clip();
              ctx.drawImage(logoWatermarkImage, lx - radius, ly - radius, lSize, lSize);
              ctx.restore();

              // Outer golden ring around custom/AI logo
              const borderGrad = ctx.createLinearGradient(lx - radius, ly - radius, lx + radius, ly + radius);
              borderGrad.addColorStop(0, '#FFE082');
              borderGrad.addColorStop(0.35, '#D4AF37');
              borderGrad.addColorStop(0.7, '#FFF8E1');
              borderGrad.addColorStop(1, '#8C6B1B');

              ctx.strokeStyle = borderGrad;
              ctx.lineWidth = 2.5 * S;
              ctx.beginPath();
              ctx.arc(lx, ly, radius, 0, Math.PI * 2);
              ctx.stroke();

              const imageBrand = (displaySettings.logoBrandName || '').trim() || 'آيات قرآنية';
              const imageSubtitle = (displaySettings.logoSubtitle || '').trim() || 'تلاوات خاشعة';
              ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.fillStyle = 'rgba(4,13,18,0.68)'; ctx.beginPath();
              ctx.roundRect(lx - radius * 0.78, ly - radius * 0.38, radius * 1.56, radius * 0.72, radius * 0.18); ctx.fill();
              let imageBrandSize = Math.max(9 * S, radius * 0.24);
              ctx.font = `bold ${imageBrandSize}px "Amiri", serif`;
              while (ctx.measureText(imageBrand).width > radius * 1.42 && imageBrandSize > 7 * S) {
                imageBrandSize -= 1 * S; ctx.font = `bold ${imageBrandSize}px "Amiri", serif`;
              }
              ctx.fillStyle = '#FFF1B8'; ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 5 * S;
              ctx.fillText(imageBrand, lx, ly - radius * 0.08);
              ctx.font = `600 ${Math.max(7 * S, radius * 0.14)}px "Cairo", sans-serif`;
              ctx.fillStyle = '#FFFFFF';
              ctx.fillText(imageSubtitle, lx, ly + radius * 0.28);
            } else {
              const logoPreset = displaySettings.logoWatermarkPreset || 'goldCalligraphy';
              const drawSealPath = (inset = 0) => {
                const r = Math.max(1, radius - inset);
                ctx.beginPath();
                if (logoPreset === 'geometricEmblem') {
                  ctx.roundRect(lx - r, ly - r, r * 2, r * 2, r * 0.24);
                } else if (logoPreset === 'glassMonogram') {
                  ctx.roundRect(lx - r * 0.96, ly - r * 0.82, r * 1.92, r * 1.64, r * 0.32);
                } else if (logoPreset === 'circularMedallion') {
                  for (let i = 0; i < 8; i += 1) {
                    const a = (i * Math.PI) / 4 - Math.PI / 8;
                    const px = lx + Math.cos(a) * r;
                    const py = ly + Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                  }
                  ctx.closePath();
                } else ctx.arc(lx, ly, r, 0, Math.PI * 2);
              };
              const grad = logoPreset === 'glassMonogram'
                ? ctx.createLinearGradient(lx - radius, ly - radius, lx + radius, ly + radius)
                : ctx.createRadialGradient(lx, ly, 0, lx, ly, radius);
              if (logoPreset === 'glassMonogram') {
                grad.addColorStop(0, 'rgba(195,231,239,0.72)'); grad.addColorStop(0.42, 'rgba(22,58,72,0.82)'); grad.addColorStop(1, 'rgba(4,13,18,0.92)');
              } else {
                grad.addColorStop(0, 'rgba(35, 26, 10, 0.85)'); grad.addColorStop(0.7, 'rgba(20, 15, 5, 0.9)'); grad.addColorStop(1, 'rgba(10, 8, 2, 0.95)');
              }

              drawSealPath();
              ctx.fillStyle = grad;
              ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
              ctx.shadowBlur = 12 * S;
              ctx.fill();

              const borderGrad = ctx.createLinearGradient(lx - radius, ly - radius, lx + radius, ly + radius);
              borderGrad.addColorStop(0, '#FFE082');
              borderGrad.addColorStop(0.35, '#D4AF37');
              borderGrad.addColorStop(0.7, '#FFF8E1');
              borderGrad.addColorStop(1, '#8C6B1B');

              ctx.strokeStyle = borderGrad;
              ctx.lineWidth = 2.5 * S;
              ctx.stroke();

              drawSealPath(radius * 0.14);
              ctx.strokeStyle = 'rgba(255, 224, 130, 0.6)';
              ctx.lineWidth = 1 * S;
              ctx.stroke();

              ctx.save(); ctx.fillStyle = '#FFE082'; ctx.strokeStyle = 'rgba(255,224,130,0.85)'; ctx.lineWidth = 1.2 * S;
              const ornamentCount = logoPreset === 'circularMedallion' ? 8 : 4;
              for (let i = 0; i < ornamentCount; i += 1) {
                const a = (i / ornamentCount) * Math.PI * 2 - Math.PI / 2;
                const ox = lx + Math.cos(a) * radius * 0.92;
                const oy = ly + Math.sin(a) * radius * 0.92;
                ctx.beginPath(); ctx.arc(ox, oy, Math.max(1.8 * S, radius * 0.035), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
              }
              if (logoPreset === 'circularMedallion') {
                ctx.strokeStyle = 'rgba(255,240,170,0.55)'; ctx.lineWidth = 1.2 * S;
                for (let i = 0; i < 12; i += 1) {
                  const a = (i / 12) * Math.PI * 2;
                  ctx.beginPath();
                  ctx.moveTo(lx + Math.cos(a) * radius * 0.52, ly + Math.sin(a) * radius * 0.52);
                  ctx.lineTo(lx + Math.cos(a) * radius * 0.78, ly + Math.sin(a) * radius * 0.78);
                  ctx.stroke();
                }
              }
              ctx.restore();

              const brandText = (displaySettings.logoBrandName || '').trim() || 'آيات قرآنية';
              const subText = (displaySettings.logoSubtitle || '').trim() || 'تلاوات خاشعة';

              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              let brandFontSize = Math.max(9 * S, Math.round(radius * (brandText.length > 12 ? 0.28 : brandText.length > 7 ? 0.36 : 0.44)));
              ctx.font = `bold ${brandFontSize}px "Amiri", "Noto Naskh Arabic", serif`;
              while (ctx.measureText(brandText).width > radius * 1.42 && brandFontSize > 7 * S) {
                brandFontSize -= 1 * S; ctx.font = `bold ${brandFontSize}px "Amiri", "Noto Naskh Arabic", serif`;
              }
              ctx.fillStyle = '#FFE082';
              ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
              ctx.shadowBlur = 4 * S;
              ctx.fillText(brandText, lx, ly - radius * 0.18);

              const subFontSize = Math.max(8 * S, Math.round(radius * 0.24));
              ctx.font = `600 ${subFontSize}px "Cairo", sans-serif`;
              ctx.fillStyle = 'rgba(255, 248, 225, 0.85)';
              ctx.shadowBlur = 2 * S;
              ctx.fillText(subText, lx, ly + radius * 0.32);
            }
            ctx.restore();
          }

          // 12.B: Social Media Handle Watermark (Only if enabled and handle provided)
          const socHandle = (displaySettings.socialHandle || displaySettings.watermarkText || '').trim()
            || (displaySettings.socialWatermarkEnabled ? '@QuranReels' : '');
          if (displaySettings.socialWatermarkEnabled && socHandle) {
            ctx.save();
            const sPos = displaySettings.socialWatermarkPosition || displaySettings.watermarkPosition || 'bottomCenter';
            const sSize = (displaySettings.socialWatermarkSize || 18) * S;
            const sOpacity = displaySettings.socialWatermarkOpacity != null ? displaySettings.socialWatermarkOpacity : 0.85;

            ctx.globalAlpha = sOpacity;
            ctx.font = `600 ${Math.round(sSize)}px "Cairo", sans-serif`;
            ctx.fillStyle = '#E5C07B';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
            ctx.shadowBlur = 6 * S;

            let sx = brandingLayout.socialX;
            let sy = brandingLayout.socialY;
            let align = 'center';

            if (sPos === 'bottomLeft') {
              align = 'left';
            } else if (sPos === 'bottomRight') {
              align = 'right';
            }
            if (sPos === 'topCenter') sy = padding + sSize;

            ctx.textAlign = align;
            ctx.textBaseline = 'bottom';

            const platform = displaySettings.socialPlatform || 'facebook';
            let icon = 'ⓕ ';
            if (platform === 'instagram') icon = '📸 ';
            else if (platform === 'tiktok') icon = '♪ ';
            else if (platform === 'youtube') icon = '▶ ';
            else if (platform === 'x') icon = '𝕏 ';
            else if (platform === 'custom') icon = '';

            const socialLabel = `${icon}${socHandle}`;
            const socialWidth = ctx.measureText(socialLabel).width;
            const pillHeight = Math.max(30 * S, sSize + 14 * S);
            const pillWidth = socialWidth + 28 * S;
            const pillX = align === 'left' ? sx - 14 * S : align === 'right' ? sx - pillWidth + 14 * S : sx - pillWidth / 2;
            const pillY = sPos === 'topCenter' ? sy - sSize - 10 * S : sy - pillHeight + 5 * S;
            ctx.fillStyle = 'rgba(4, 13, 18, 0.72)'; ctx.shadowBlur = 12 * S; ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(pillX, pillY, pillWidth, pillHeight, pillHeight / 2); else ctx.rect(pillX, pillY, pillWidth, pillHeight);
            ctx.fill(); ctx.strokeStyle = 'rgba(212, 175, 55, 0.65)'; ctx.lineWidth = 1.2 * S; ctx.stroke();
            ctx.fillStyle = '#FFF1B8'; ctx.shadowBlur = 6 * S;
            ctx.fillText(socialLabel, sx, sy);
            ctx.restore();
          }

          // Keep required attribution tied to the actual dataset. QUA is not
          // Quran Foundation and must never inherit the legacy QF label.
          const isQuaTiming = manifest.timingMap?.sourceId === 'quranic_universal_audio';
          const requiresQfCredit = !isQuaTiming && (manifest.timingMap?.sourceId === 'quran_foundation'
            || manifest.timingMap?.alignment?.provider === 'quran_foundation'
            || manifest.audio?.sourceMode === 'qf');
          if (requiresQfCredit || isQuaTiming) {
            const logoCorner = displaySettings.logoWatermarkPosition || 'topRight';
            const socialCorner = displaySettings.socialWatermarkPosition || displaySettings.watermarkPosition || 'bottomCenter';
            const headerCorner = displaySettings.surahNamePosition || 'top';
            const occupiedCorners = new Set();
            if (displaySettings.logoWatermarkEnabled !== false) occupiedCorners.add(logoCorner);
            if (displaySettings.socialWatermarkEnabled && socialCorner !== 'topCenter') occupiedCorners.add(socialCorner);
            if ((displaySettings.showSurahName || displaySettings.showReciterName)
              && ['topLeft', 'topRight', 'bottomLeft', 'bottomRight'].includes(headerCorner)) occupiedCorners.add(headerCorner);
            const creditCorner = ['bottomLeft', 'topLeft', 'bottomRight', 'topRight']
              .find((corner) => !occupiedCorners.has(corner)) || 'bottomCenter';
            const creditText = isQuaTiming
              ? 'Source: Quranic Universal Audio'
              : 'Source: Quran Foundation';
            const creditFontSize = Math.max(12, 13 * S);
            const creditPadX = Math.max(7, 8 * S);
            const creditPadY = Math.max(4, 5 * S);

            ctx.save();
            ctx.font = `600 ${creditFontSize}px "Cairo", Arial, sans-serif`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            const creditWidth = ctx.measureText(creditText).width + creditPadX * 2;
            const creditHeight = creditFontSize + creditPadY * 2;
            const isLeft = creditCorner.endsWith('Left');
            const isTop = creditCorner.startsWith('top');
            const creditX = creditCorner === 'bottomCenter'
              ? (W - creditWidth) / 2
              : isLeft ? brandingLayout.edge : W - brandingLayout.edge - creditWidth;
            const creditY = isTop ? brandingLayout.edge : H - brandingLayout.edge - creditHeight;
            ctx.fillStyle = 'rgba(4, 13, 18, 0.82)';
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.72)';
            ctx.lineWidth = Math.max(1, S);
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(creditX, creditY, creditWidth, creditHeight, creditHeight / 2);
            else ctx.rect(creditX, creditY, creditWidth, creditHeight);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#FFF1B8';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 3 * S;
            ctx.fillText(creditText, creditX + creditPadX, creditY + creditHeight / 2);
            ctx.restore();
          }

          return true;
        },

        isSceneReady() {
          return isReady;
        },

        getVideoBackgroundStatus() {
          return videoBackgroundStatus;
        }
      };
      }

      const defaultCanvas = document.getElementById('render-canvas');
      window.__CREATE_RENDER_CONTROLLER__ = createRenderController;
      window.__RENDER_CONTROLLER__ = defaultCanvas ? createRenderController(defaultCanvas) : null;
    })();
  </script>
</body>
</html>
