name: Catalog quality
on:
  pull_request:
    paths: ['server/**', 'shared/**', 'scripts/**', 'src/test/**', 'src/admin/**', 'package*.json', '.github/workflows/catalog-quality.yml']
  push:
    branches: [main]
    paths: ['server/**', 'shared/**', 'scripts/**', 'src/test/**', 'src/admin/**', 'package*.json', '.github/workflows/catalog-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Check actual admin TypeScript roots
        run: node scripts/verify-admin-types.mjs
      - name: Lint changed files against baseline
        run: node scripts/lint-changed-files.mjs --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}"
      - run: npm test
      - run: npm run build
      # Real R2 tests are discovered by npm test and skip without explicit staging-only credentials.
