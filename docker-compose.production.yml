services:
  api:
    build: .
    command: node node_modules/tsx/dist/cli.mjs server/index.ts
    env_file: .env
    environment:
      RENDER_QUEUE_DRIVER: bullmq
      ENGINE_SKIA_ENABLED: 'true'
      ENGINE_FFMPEG_ENABLED: 'false'
      ENGINE_BROWSER_ENABLED: 'false'
      RENDER_MAX_BACKLOG: 50
      SKIA_RENDER_REPLICAS: 1
      SKIA_RENDER_SLOTS_PER_REPLICA: 1
      MYSQL_POOL_SIZE: 5
    depends_on: [redis]
    deploy:
      replicas: 1

  worker-ffmpeg:
    profiles: [diagnostics]
    build:
      context: .
      dockerfile: Dockerfile.worker-lite
    command: node node_modules/tsx/dist/cli.mjs server/worker.ts
    env_file: .env
    environment:
      RENDER_QUEUE_DRIVER: bullmq
      RENDER_WORKER_ENGINE: ffmpeg_ass
      FFMPEG_RENDER_MAX_CONCURRENCY: auto
    depends_on: [redis]
    deploy:
      replicas: 1

  worker-skia:
    build:
      context: .
      dockerfile: Dockerfile.worker-lite
    command: node node_modules/tsx/dist/cli.mjs server/worker.ts
    env_file: .env
    environment:
      RENDER_QUEUE_DRIVER: bullmq
      RENDER_WORKER_ENGINE: skia_canvas
      SKIA_RENDER_MAX_CONCURRENCY: 1
      RENDER_CAPACITY_HARD_MAX: 1
      RENDER_FFMPEG_THREADS: 1
      RENDER_FFMPEG_PRESET: veryfast
      RENDER_ASSET_CACHE_MB: 64
      MYSQL_POOL_SIZE: 3
    depends_on: [redis]
    deploy:
      replicas: 1

  worker-browser:
    profiles: [diagnostics]
    build:
      context: .
      dockerfile: Dockerfile.worker-browser
    command: node node_modules/tsx/dist/cli.mjs server/worker.ts
    env_file: .env
    environment:
      RENDER_QUEUE_DRIVER: bullmq
      RENDER_WORKER_ENGINE: browser_cloud
      BROWSER_RENDER_MAX_CONCURRENCY: auto
    depends_on: [redis]
    deploy:
      replicas: 1

  render-control:
    build:
      context: .
      dockerfile: Dockerfile.worker-lite
    command: node node_modules/tsx/dist/cli.mjs server/renderControl.ts
    env_file: .env
    environment:
      RENDER_QUEUE_DRIVER: bullmq
      RAILWAY_AUTOSCALER_ENABLED: 'false'
    depends_on: [redis]
    deploy:
      replicas: 1

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]

volumes:
  redis-data:
